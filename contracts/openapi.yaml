openapi: 3.0.3
info:
  title: Stead API
  version: 1.0.0
  description: Authoritative contract for the API surface consumed by Stead mobile.
servers:
  - url: http://localhost:3000
paths:
  /auth/countries:
    get:
      operationId: getAuthCountries
      responses:
        '200':
          description: Supported authentication countries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCountriesResponse'
  /auth/request-otp:
    post:
      operationId: requestOtp
      parameters:
        - $ref: '#/components/parameters/SteadDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestOtpRequest'
      responses:
        '201':
          description: OTP accepted for queue-backed delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/verify-otp:
    post:
      operationId: verifyOtp
      parameters:
        - $ref: '#/components/parameters/SteadDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '201':
          description: OTP verified and JWT issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyOtpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /goals:
    get:
      operationId: listGoals
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Goals in descending creation order, including lifecycle history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createGoal
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGoalRequest'
      responses:
        '201':
          description: Goal created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /goals/active:
    get:
      operationId: getActiveGoal
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Active goal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /goals/{id}:
    patch:
      operationId: updateGoal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalRequest'
      responses:
        '200':
          description: Goal updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /goals/{id}/end:
    post:
      operationId: endGoal
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndGoalRequest'
      responses:
        '200':
          description: Goal completed or cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Goal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /transactions:
    get:
      operationId: listTransactions
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Transactions in descending occurrence order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '201':
          description: Transaction created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /transactions/{id}:
    patch:
      operationId: updateTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Transaction updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTransaction
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Transaction deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /dashboard/stability:
    get:
      operationId: getDashboardStability
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current stability metrics or the no-active-goal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStabilityResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /alerts/preferences:
    get:
      operationId: getAlertPreferences
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer notification preferences. Defaults are returned before first save.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPreferences'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      operationId: updateAlertPreferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAlertPreferencesRequest'
      responses:
        '200':
          description: Updated customer notification preferences.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account:
    get:
      operationId: getAccount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Customer profile and current optional-consent choices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteAccount
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '200':
          description: Account and associated customer data permanently deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /account/profile:
    patch:
      operationId: updateAccountProfile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountProfileRequest'
      responses:
        '200':
          description: Updated customer account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /account/consents:
    put:
      operationId: updateAccountConsents
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountConsentsRequest'
      responses:
        '200':
          description: Updated optional-consent choices with an auditable change record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /account/export:
    get:
      operationId: exportAccountData
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Portable JSON export of customer-visible and account activity data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDataExport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SteadDeviceId:
      name: X-Stead-Device-Id
      in: header
      required: false
      description: Optional mobile installation UUID used as an additive abuse-control signal. The API persists only a keyed hash.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$'
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    BadRequest:
      description: Request validation or domain validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is missing or invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: OTP abuse-control limit reached.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    AccountProfile:
      type: object
      additionalProperties: false
      required: [id, phone, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
          minLength: 1
        phone:
          type: string
          minLength: 1
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountConsents:
      type: object
      additionalProperties: false
      required: [analyticsEnabled, productResearchEnabled, updatedAt]
      properties:
        analyticsEnabled:
          type: boolean
        productResearchEnabled:
          type: boolean
        updatedAt:
          type: string
          format: date-time
          nullable: true
    AccountResponse:
      type: object
      additionalProperties: false
      required: [profile, consents]
      properties:
        profile:
          $ref: '#/components/schemas/AccountProfile'
        consents:
          $ref: '#/components/schemas/AccountConsents'
    UpdateAccountProfileRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
    UpdateAccountConsentsRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        analyticsEnabled:
          type: boolean
        productResearchEnabled:
          type: boolean
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [DELETE]
    DeleteAccountResponse:
      type: object
      additionalProperties: false
      required: [ok, deletedAt]
      properties:
        ok:
          type: boolean
          enum: [true]
        deletedAt:
          type: string
          format: date-time
    ConsentCategory:
      type: string
      enum: [analytics, product_research]
    ConsentHistoryRecord:
      type: object
      additionalProperties: false
      required: [category, granted, createdAt]
      properties:
        category:
          $ref: '#/components/schemas/ConsentCategory'
        granted:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ExportGoal:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          amountTotalKobo,
          dueDate,
          monthlyIncomeKobo,
          isActive,
          status,
          endedAt,
          createdAt,
        ]
      properties:
        id:
          type: string
        name:
          type: string
        amountTotalKobo:
          type: integer
        dueDate:
          type: string
          format: date-time
        monthlyIncomeKobo:
          type: integer
          nullable: true
        isActive:
          type: boolean
        status:
          $ref: '#/components/schemas/GoalStatus'
        endedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    ExportTransaction:
      type: object
      additionalProperties: false
      required: [id, goalId, amountKobo, direction, occurredAt, note, createdAt]
      properties:
        id:
          type: string
        goalId:
          type: string
          nullable: true
        amountKobo:
          type: integer
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    ExportAlertPreferences:
      type: object
      additionalProperties: false
      required:
        [
          weeklySummaryEnabled,
          riskAlertsEnabled,
          timeZone,
          weeklyDay,
          weeklyHourLocal,
          updatedAt,
        ]
      properties:
        weeklySummaryEnabled:
          type: boolean
        riskAlertsEnabled:
          type: boolean
        timeZone:
          type: string
        weeklyDay:
          type: integer
        weeklyHourLocal:
          type: integer
        updatedAt:
          type: string
          format: date-time
    ExportAuthEvent:
      type: object
      additionalProperties: false
      required: [type, countryIso, createdAt]
      properties:
        type:
          type: string
        countryIso:
          type: string
        createdAt:
          type: string
          format: date-time
    ExportNotification:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          status,
          provider,
          providerMessageId,
          createdAt,
          sentAt,
          failedAt,
        ]
      properties:
        id:
          type: string
        type:
          type: string
        status:
          type: string
        provider:
          type: string
          nullable: true
        providerMessageId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: string
          format: date-time
          nullable: true
        failedAt:
          type: string
          format: date-time
          nullable: true
    AccountDataExport:
      type: object
      additionalProperties: false
      required:
        [
          schemaVersion,
          exportedAt,
          profile,
          consents,
          consentHistory,
          goals,
          transactions,
          alertPreferences,
          authHistory,
          notificationHistory,
        ]
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        exportedAt:
          type: string
          format: date-time
        profile:
          $ref: '#/components/schemas/AccountProfile'
        consents:
          $ref: '#/components/schemas/AccountConsents'
        consentHistory:
          type: array
          items:
            $ref: '#/components/schemas/ConsentHistoryRecord'
        goals:
          type: array
          items:
            $ref: '#/components/schemas/ExportGoal'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/ExportTransaction'
        alertPreferences:
          allOf:
            - $ref: '#/components/schemas/ExportAlertPreferences'
          nullable: true
        authHistory:
          type: array
          items:
            $ref: '#/components/schemas/ExportAuthEvent'
        notificationHistory:
          type: array
          items:
            $ref: '#/components/schemas/ExportNotification'
    UpdateAlertPreferencesRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        weeklySummaryEnabled:
          type: boolean
        riskAlertsEnabled:
          type: boolean
        timeZone:
          type: string
          minLength: 1
          maxLength: 100
          description: IANA time zone used for weekly delivery.
        weeklyDay:
          type: integer
          minimum: 0
          maximum: 6
          description: Local weekday, where Sunday is 0 and Saturday is 6.
        weeklyHourLocal:
          type: integer
          minimum: 0
          maximum: 23
    AlertPreferences:
      type: object
      additionalProperties: false
      required:
        - weeklySummaryEnabled
        - riskAlertsEnabled
        - channel
        - timeZone
        - weeklyDay
        - weeklyHourLocal
        - updatedAt
      properties:
        weeklySummaryEnabled:
          type: boolean
        riskAlertsEnabled:
          type: boolean
        channel:
          type: string
          enum: [sms]
        timeZone:
          type: string
        weeklyDay:
          type: integer
          minimum: 0
          maximum: 6
        weeklyHourLocal:
          type: integer
          minimum: 0
          maximum: 23
        updatedAt:
          type: string
          format: date-time
          nullable: true
    RequestOtpRequest:
      type: object
      additionalProperties: false
      required: [countryIso, phone]
      properties:
        countryIso:
          type: string
          pattern: '^[A-Z]{2}$'
        phone:
          type: string
          pattern: '^(?:\+?\d{6,15}|0\d{6,14}|00\d{6,15})$'
    VerifyOtpRequest:
      type: object
      additionalProperties: false
      required: [countryIso, phone, otp]
      properties:
        countryIso:
          type: string
          pattern: '^[A-Z]{2}$'
        phone:
          type: string
          pattern: '^(?:\+?\d{6,15}|0\d{6,14}|00\d{6,15})$'
        otp:
          type: string
          pattern: '^\d{6}$'
    RequestOtpResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
        otp:
          type: string
          pattern: '^\d{6}$'
          description: Development-only OTP hint when explicitly enabled.
    VerifyOtpResponse:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    AuthCountry:
      type: object
      additionalProperties: false
      required:
        - iso
        - label
        - dialCode
        - currencyCode
        - phoneExample
        - authEnabled
        - marketEnabled
        - defaultCountry
      properties:
        iso:
          type: string
          pattern: '^[A-Z]{2}$'
        label:
          type: string
          minLength: 1
        dialCode:
          type: string
          pattern: '^\+\d{1,4}$'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
        phoneExample:
          type: string
          minLength: 1
        authEnabled:
          type: boolean
        marketEnabled:
          type: boolean
        defaultCountry:
          type: boolean
    AuthCountriesResponse:
      type: object
      additionalProperties: false
      required: [countries]
      properties:
        countries:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuthCountry'
    CreateGoalRequest:
      type: object
      additionalProperties: false
      required: [name, amountTotalKobo, dueDate]
      properties:
        name:
          type: string
          maxLength: 100
        amountTotalKobo:
          type: integer
          minimum: 1
        dueDate:
          type: string
          format: date-time
        monthlyIncomeKobo:
          type: integer
          minimum: 0
    UpdateGoalRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
        amountTotalKobo:
          type: integer
          minimum: 1
        dueDate:
          type: string
          format: date-time
        monthlyIncomeKobo:
          type: integer
          minimum: 0
          nullable: true
        isActive:
          type: boolean
          deprecated: true
          description: Legacy activation control. New clients should use goal lifecycle actions.
    EndGoalRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [completed, cancelled]
    GoalStatus:
      type: string
      enum: [active, completed, cancelled, replaced]
    Goal:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - name
        - amountTotalKobo
        - dueDate
        - monthlyIncomeKobo
        - isActive
        - status
        - endedAt
        - createdAt
      properties:
        id:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        name:
          type: string
        amountTotalKobo:
          type: integer
        dueDate:
          type: string
          format: date-time
        monthlyIncomeKobo:
          type: integer
          nullable: true
        isActive:
          type: boolean
        status:
          $ref: '#/components/schemas/GoalStatus'
        endedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [direction, amountKobo, occurredAt]
      properties:
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        amountKobo:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        goalId:
          type: string
          minLength: 1
        note:
          type: string
          maxLength: 280
    UpdateTransactionRequest:
      type: object
      additionalProperties: false
      properties:
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        amountKobo:
          type: integer
          minimum: 1
        occurredAt:
          type: string
          format: date-time
        goalId:
          type: string
          nullable: true
        note:
          type: string
          maxLength: 280
          nullable: true
    TransactionDirection:
      type: string
      enum: [in, out]
    Transaction:
      type: object
      additionalProperties: false
      required:
        - id
        - userId
        - goalId
        - amountKobo
        - direction
        - occurredAt
        - note
        - createdAt
      properties:
        id:
          type: string
          minLength: 1
        userId:
          type: string
          minLength: 1
        goalId:
          type: string
          nullable: true
        amountKobo:
          type: integer
        direction:
          $ref: '#/components/schemas/TransactionDirection'
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
    DashboardMetrics:
      type: object
      additionalProperties: false
      required:
        - daysRemaining
        - remainingObligationKobo
        - readinessPct
        - paceRequiredMonthlyKobo
        - safeToSpendKobo
        - stabilityScore
        - status
        - goalSavedKobo
        - estimatedBalanceKobo
      properties:
        daysRemaining:
          type: integer
        remainingObligationKobo:
          type: integer
        readinessPct:
          type: number
        paceRequiredMonthlyKobo:
          type: integer
        safeToSpendKobo:
          type: integer
        stabilityScore:
          type: integer
        status:
          type: string
          enum: [stable, warning, critical]
        goalSavedKobo:
          type: integer
        estimatedBalanceKobo:
          type: integer
    DashboardGoal:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - amountTotalKobo
        - dueDate
        - monthlyIncomeKobo
      properties:
        id:
          type: string
        name:
          type: string
        amountTotalKobo:
          type: integer
        dueDate:
          type: string
          format: date-time
        monthlyIncomeKobo:
          type: integer
          nullable: true
    DashboardStabilityOkResponse:
      type: object
      additionalProperties: false
      required: [ok, goal, metrics]
      properties:
        ok:
          type: boolean
          enum: [true]
        goal:
          $ref: '#/components/schemas/DashboardGoal'
        metrics:
          $ref: '#/components/schemas/DashboardMetrics'
    DashboardStabilityEmptyResponse:
      type: object
      additionalProperties: false
      required: [ok, message]
      properties:
        ok:
          type: boolean
          enum: [false]
        message:
          type: string
    DashboardStabilityResponse:
      oneOf:
        - $ref: '#/components/schemas/DashboardStabilityOkResponse'
        - $ref: '#/components/schemas/DashboardStabilityEmptyResponse'
    OkResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    ErrorResponse:
      type: object
      required: [statusCode, message]
      properties:
        statusCode:
