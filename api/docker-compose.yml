services:
  db:
    image: ${POSTGRES_IMAGE:?Use the root db:start command to load the shared image pin}
    container_name: stead_db
    environment:
      POSTGRES_USER: stead
      POSTGRES_PASSWORD: stead
      POSTGRES_DB: stead
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
