appId: com.lawaloy.stead
---
# Run only against an isolated API schema with SMS_PROVIDER=dev,
# DEV_EXPOSE_OTP=true, and EXPO_PUBLIC_E2E_PHONE set to a unique disposable
# NG number (Maestro cannot reliably type into the RN phone field on iOS).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Stead Login
    timeout: 240000
- extendedWaitUntil:
    visible: '0803 000 0001'
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: auth-request-otp
# iOS 26 simulator: XCTest injects each tap through a fresh virtual digitizer.
# Under load backboardd sometimes registers it twice ("unknown digitizer"),
# drops the lift-off ("didn't see a previous touch down") and then cancels the
# touch ("canceling paths"). The app only gets touch-down + cancel, so onPress
# never runs and no request is sent.
# Tap once more only while the button is still idle. An accepted tap renders
# "Requesting..." with the button disabled until the request settles, and on
# success Verify OTP is pushed before the button re-enables. So "Request OTP"
# enabled with no Verify OTP means the first touch never reached onPress, and
# this tap cannot duplicate a request. Never tap again once the request has
# started: the app owns bounded retries with one idempotency key.
- runFlow:
    label: Re-tap Request OTP after a dropped iOS simulator touch
    when:
      platform: iOS
      visible:
        id: auth-request-otp
        text: Request OTP
        enabled: true
      notVisible: Verify OTP
    commands:
      - tapOn:
          id: auth-request-otp
# Keep this wait long (same as Stead Login): on slow CI macOS simulators the
# OTP request round-trip (JS thread + local API + app retries) can exceed 60s,
# and a timeout here cannot be recovered by tapping again.
- extendedWaitUntil:
    visible: Verify OTP
    timeout: 240000
- assertVisible: 'Dev OTP:.*'
- tapOn:
    id: auth-verify-otp
- extendedWaitUntil:
    visible: Stability Dashboard
    timeout: 90000
- extendedWaitUntil:
    visible: 'No active goal found.*'
    timeout: 60000

- tapOn:
    id: nav-goal
- assertVisible: Create a goal
- tapOn:
    id: goal-name
- inputText: Native journey goal
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: goal-target
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: goal-target
- inputText: '1200000'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Create a goal
- scrollUntilVisible:
    element:
      id: goal-save
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: goal-save
- assertVisible: Goal created
- tapOn:
    id: nav-dashboard
- assertVisible: Native journey goal
- assertVisible: '0%'

# Create an income worth 20% of the goal, then correct its amount and note.
- tapOn:
    id: nav-activity
- tapOn:
    id: transaction-add
- assertVisible: Add Transaction
- tapOn:
    id: transaction-amount
- eraseText: 100
- inputText: '240000'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: transaction-note
- eraseText: 100
- inputText: Native journey income
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Add Transaction
- scrollUntilVisible:
    element:
      id: transaction-create
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: transaction-create
- assertVisible: Transaction added
- tapOn:
    id: nav-activity
- scrollUntilVisible:
    element: Native journey income
    timeout: 40000
    visibilityPercentage: 50
- assertVisible: Native journey income
- tapOn:
    id: nav-dashboard
# Wait for the loaded dashboard ScrollView before PTR. Loading/empty states do
# not mount testID dashboard-refresh; swiping too early fails on iOS.
- extendedWaitUntil:
    visible:
      id: dashboard-refresh
    timeout: 60000
- extendedWaitUntil:
    visible: Native journey goal
    timeout: 30000
# iOS Maestro swipe-down is flaky (misses the view / hits system UI). The
# dashboard refetches when the screen gains focus, so waiting for readiness is
# enough there. Android still exercises pull-to-refresh.
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: dashboard-refresh
          direction: DOWN
- extendedWaitUntil:
    visible: '20%'
    timeout: 90000

- tapOn:
    id: nav-activity
- scrollUntilVisible:
    element: Edit Native journey income transaction
    timeout: 40000
    visibilityPercentage: 50
- tapOn: Edit Native journey income transaction
- scrollUntilVisible:
    element:
      id: transaction-edit-amount
    direction: UP
    timeout: 40000
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
# Tap the right padding so backspace starts at the end of the prefilled value.
# Do not repeat taps after the keyboard opens: iOS can move the field while
# retaining its previous accessibility bounds, making another tap hit a key.
# Verify each replacement after dismissing the keyboard.
- tapOn:
    id: transaction-edit-amount
    point: '95%,50%'
    retryTapIfNoChange: false
- eraseText: 100
- inputText: '360000'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      # The numeric keyboard has no return key. Tap the visible ScrollView
      # title, not the Activity navigation tab or a label under the keyboard.
      - tapOn:
          text: Activity
          below:
            id: nav-activity
# Android's IME can obscure the editor in the accessibility tree. Check the
# entered value only after dismissing the keyboard and exposing the field.
- scrollUntilVisible:
    element:
      id: transaction-edit-amount
    direction: UP
    timeout: 40000
    visibilityPercentage: 100
    centerElement: true
- assertVisible:
    id: transaction-edit-amount
    text: '360000'
- scrollUntilVisible:
    element:
      id: transaction-edit-note
    timeout: 40000
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: transaction-edit-note
    point: '95%,50%'
    retryTapIfNoChange: false
- eraseText: 100
- inputText: Native journey corrected income
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      # The numeric keyboard has no return key. Tap the visible ScrollView
      # title, not the Activity navigation tab or a label under the keyboard.
      - tapOn:
          text: Activity
          below:
            id: nav-activity
- scrollUntilVisible:
    element:
      id: transaction-edit-note
    timeout: 40000
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: transaction-edit-note
    text: Native journey corrected income
- scrollUntilVisible:
    element:
      id: transaction-save
    timeout: 40000
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd
- assertVisible:
    id: transaction-save
    enabled: true
- tapOn:
    id: transaction-save
- extendedWaitUntil:
    notVisible: Edit transaction
    timeout: 60000
- scrollUntilVisible:
    element: Native journey corrected income
    timeout: 40000
    visibilityPercentage: 50
- assertNotVisible: Native journey income
- tapOn:
    id: nav-dashboard
- extendedWaitUntil:
    visible: '30%'
    timeout: 90000

# A real process restart on both platforms must restore the saved credential
# and reload protected goal/transaction data. Returning to login is a failure.
- stopApp
- launchApp:
    clearState: false
    clearKeychain: false
- extendedWaitUntil:
    visible: Stability Dashboard
    timeout: 240000
- extendedWaitUntil:
    visible: Native journey goal
    timeout: 90000
- extendedWaitUntil:
    visible: '30%'
    timeout: 90000
- assertNotVisible: Stead Login
- tapOn:
    id: nav-activity
- scrollUntilVisible:
    element: Delete Native journey corrected income transaction
    timeout: 40000
    visibilityPercentage: 50
- assertVisible: Native journey corrected income
- tapOn: Delete Native journey corrected income transaction
- tapOn: Delete
- assertVisible: No transactions yet

- tapOn:
    id: nav-dashboard
- extendedWaitUntil:
    visible:
      id: dashboard-refresh
    timeout: 60000
- assertVisible: Native journey goal
- runFlow:
    when:
      platform: Android
    commands:
      - swipe:
          from:
            id: dashboard-refresh
          direction: DOWN
- extendedWaitUntil:
    visible: '0%'
    timeout: 60000
- assertVisible: Safe To Spend

# Logout must also survive a process restart on both platforms.
- tapOn:
    id: app-logout
- extendedWaitUntil:
    visible: Stead Login
    timeout: 60000
- stopApp
- launchApp:
    clearState: false
    clearKeychain: false
- extendedWaitUntil:
    visible: Stead Login
    timeout: 240000
- assertNotVisible: Stability Dashboard
