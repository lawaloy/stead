appId: com.lawaloy.stead
---
# Run only against an isolated API schema with SMS_PROVIDER=dev,
# DEV_EXPOSE_OTP=true, and EXPO_PUBLIC_E2E_PHONE set to a unique disposable
# NG number (Maestro cannot reliably type into the RN phone field on iOS).
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: Stead Login
    timeout: 240000
- extendedWaitUntil:
    visible: '0803 000 0001'
    timeout: 30000
- tapOn:
    id: auth-request-otp
- extendedWaitUntil:
    visible: Verify OTP
    timeout: 60000
- assertVisible: 'Dev OTP:.*'
- tapOn:
    id: auth-verify-otp
- assertVisible: Stability Dashboard
- assertVisible: No active goal found

- tapOn:
    id: nav-goal
- assertVisible: Create a goal
- tapOn:
    id: goal-name
- inputText: Native journey goal
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- scrollUntilVisible:
    element:
      id: goal-target
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: goal-target
- inputText: '1200000'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Create a goal
- scrollUntilVisible:
    element:
      id: goal-save
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: goal-save
- assertVisible: Goal created
- tapOn:
    id: nav-dashboard
- assertVisible: Native journey goal
- assertVisible: '0%'

- tapOn:
    id: nav-activity
- tapOn:
    id: transaction-add
- assertVisible: Add Transaction
- tapOn:
    id: transaction-amount
- eraseText: 100
- inputText: '120000'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: transaction-note
- eraseText: 100
- inputText: Native journey income
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Add Transaction
- scrollUntilVisible:
    element:
      id: transaction-create
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: transaction-create
- assertVisible: Transaction added
- tapOn:
    id: nav-activity
- assertVisible: Native journey income
- tapOn:
    id: nav-dashboard
- assertVisible: '10%'
- tapOn:
    id: nav-activity
- scrollUntilVisible:
    element: Edit Native journey income transaction
    timeout: 40000
    visibilityPercentage: 50
- tapOn: Edit Native journey income transaction
- tapOn:
    id: transaction-edit-amount
- eraseText: 100
- inputText: '240000'
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Edit transaction
- scrollUntilVisible:
    element:
      id: transaction-save
    timeout: 40000
    visibilityPercentage: 50
- tapOn:
    id: transaction-save
- assertVisible: Native journey income
- tapOn:
    id: nav-dashboard
# Remount + pull-to-refresh on the dashboard ScrollView (not the shell).
- tapOn:
    id: nav-activity
- tapOn:
    id: nav-dashboard
- swipe:
    from:
      id: dashboard-refresh
    direction: DOWN
- extendedWaitUntil:
    visible: '20%'
    timeout: 60000
- tapOn:
    id: nav-activity
- scrollUntilVisible:
    element: Delete Native journey income transaction
    timeout: 40000
    visibilityPercentage: 50
- tapOn: Delete Native journey income transaction
- tapOn: Delete
- assertVisible: No transactions yet

- tapOn:
    id: nav-dashboard
- assertVisible: Native journey goal
- swipe:
    from:
      id: dashboard-refresh
    direction: DOWN
- extendedWaitUntil:
    visible: '0%'
    timeout: 60000
- assertVisible: Safe To Spend

# Relaunch without clearing native secure storage to check session restore.
- stopApp
- launchApp
- assertVisible: Native journey goal
- tapOn:
    id: app-logout
- assertVisible: Stead Login
- stopApp
- launchApp
- assertVisible: Stead Login
