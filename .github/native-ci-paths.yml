native:
  - 'package.json'
  - 'package-lock.json'
  - 'mobile/.maestro/**'
  - 'mobile/app/**'
  - 'mobile/src/**'
  - '!mobile/src/__tests__/**'
  - '!mobile/src/**/*.test.*'
  - '!mobile/src/**/*.spec.*'
  - 'mobile/assets/**'
  - 'mobile/app.json'
  - 'mobile/babel.config.js'
  - 'mobile/tsconfig.json'
  - 'mobile/metro.config.js'
  - 'mobile/package.json'
  - 'mobile/package-lock.json'
  - 'mobile/Gemfile'
  - 'mobile/Gemfile.lock'
  - 'api/**'
  # API tests validate the API boundary directly and do not change the app
  # exercised by the native customer journey.
  - '!api/**/*.spec.ts'
  - '!api/**/*.test.ts'
  - '!api/test/**'
  - '!api/**/__tests__/**'
  - 'contracts/**'
  - '.github/native-ci-paths.yml'
  - '.github/workflows/native-ci.yml'
  - '.github/native-container/**'
  - '.github/scripts/run-android-native-journey.sh'
  - '.github/scripts/build-ios-simulator-app.sh'
  - '.github/scripts/install-maestro.sh'
  - '.github/ci.env'
  - 'scripts/native-*.mjs'
  - 'scripts/android-*.mjs'
  - 'scripts/archive-utils.mjs'
  - 'scripts/ios-setup.mjs'
  - '.github/android-sdk-lock.json'
  - 'scripts/process-utils.mjs'
  - 'scripts/local-workflow.mjs'
  - 'scripts/ios-simulator-entitlements.mjs'
  - 'scripts/toolchain.mjs'
  - 'scripts/install-maestro.mjs'
  - '.github/scripts/install-native-postgres.sh'
  - '!scripts/*.test.mjs'
