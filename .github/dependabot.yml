# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "cron"
      cronjob: "0 13 * * *"
    rebase-strategy: "auto"
    # Routine version updates are handled by the repository-owned API dependency
    # maintenance workflow, which safely exits when an update produces no diff.
    # A zero limit disables version PRs without disabling security updates.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "cron"
      cronjob: "0 13 * * *"
    rebase-strategy: "auto"
    # Routine version updates are handled by the repository-owned mobile
    # dependency maintenance workflow, which safely exits when an update
    # produces no diff. A zero limit disables version PRs without disabling
    # security updates.
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"
