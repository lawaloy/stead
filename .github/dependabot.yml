# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "cron"
      cronjob: "0 13 * * *"
    # TypeScript 7 is blocked until the API lint/test toolchain supports it.
    # The typescript-7-readiness workflow checks this weekly so the ignore
    # can be removed when upstream packages are ready.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm-safe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: "npm"
    directory: "/mobile"
    schedule:
      interval: "cron"
      cronjob: "0 13 * * *"
    groups:
      npm-safe:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      npm-major:
        patterns:
          - "*"
        update-types:
          - "major"
