name: PR Auto Finish Reusable

on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      pull_number:
        required: false
        type: number
        default: 0

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  finish:
    name: Merge Ready Dependency PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Merge PR when ready
        uses: actions/github-script@v7
        env:
          LANE: ${{ inputs.lane }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const requestedLane = process.env.LANE;
            const eventPullNumber = context.payload.workflow_run?.pull_requests?.[0]?.number;
            const inputPullNumber = Number(process.env.PULL_NUMBER || 0);
            const pull_number = eventPullNumber || inputPullNumber;
            const { owner, repo } = context.repo;
            const maxAttempts = 40;
            const delayMs = 15000;
            const dependencyAuditPaths = [
              'api/package.json',
              'api/package-lock.json',
              'mobile/package.json',
              'mobile/package-lock.json',
              '.github/dependency-audit-exceptions.json',
              '.github/scripts/audit-npm.mjs',
            ];
            const requiredWorkflowContracts = [
              { name: 'ci', path: '.github/workflows/ci.yml' },
              { name: 'native-ci', path: '.github/workflows/native-ci.yml' },
              { name: 'CodeQL Advanced', path: '.github/workflows/codeql.yml' },
              { name: 'Dependency review', path: '.github/workflows/dependency-review.yml' },
              {
                name: 'Dependency Audit',
                path: '.github/workflows/dependency-audit.yml',
                expected: (files) => files.some((file) => dependencyAuditPaths.includes(file.filename)),
              },
            ];
            const normalizeWorkflowPath = (path = '') => {
              const withoutRef = path.split('@')[0];
              const workflowRoot = withoutRef.indexOf('.github/workflows/');
              return workflowRoot === -1 ? withoutRef : withoutRef.slice(workflowRoot);
            };
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            if (!pull_number) {
              core.info('Skipping because no pull request number was available on the workflow_run payload.');
              return;
            }

            const ensureComment = async (body) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });

              if (comments.some((comment) => comment.body === body)) {
                core.info('Skipping comment because the same comment already exists.');
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            };

            const addBlockedLabel = async (labels) => {
              if (labels.includes('automerge-blocked')) {
                return;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: ['automerge-blocked'],
              });
            };

            const isTrustedDependabot = (pr) => {
              const authorLogin = pr.user?.login || '';
              const headRef = pr.head?.ref || '';
              return (
                ['dependabot[bot]', 'app/dependabot'].includes(authorLogin) &&
                headRef.startsWith('dependabot/')
              );
            };

            const isTrustedMaintenance = (pr, labels) => {
              const authorLogin = pr.user?.login || '';
              return (
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                pr.base?.ref === 'main' &&
                ['chore/mobile-deps-maintenance', 'chore/api-deps-maintenance'].includes(pr.head?.ref) &&
                ['app/github-actions', 'github-actions[bot]', 'stead-deps[bot]', 'app/stead-deps'].includes(authorLogin) &&
                labels.includes('dependencies')
              );
            };

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const pullRequest = (
                await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number,
                })
              ).data;
              const labels = pullRequest.labels.map((label) => label.name);
              if (pullRequest.draft || pullRequest.state !== 'open') {
                core.info('Skipping because the PR is draft or no longer open.');
                return;
              }
              const trustedDependabot = isTrustedDependabot(pullRequest);
              const trustedMaintenance = isTrustedMaintenance(pullRequest, labels);
              const lane =
                requestedLane === 'auto'
                  ? trustedDependabot
                    ? 'dependabot'
                    : trustedMaintenance
                      ? 'maintenance'
                      : undefined
                  : requestedLane;
              const trusted =
                lane === 'dependabot'
                  ? trustedDependabot
                  : lane === 'maintenance'
                    ? trustedMaintenance
                    : false;

              if (!trusted) {
                core.info(
                  `Skipping because PR does not satisfy trusted ${requestedLane} provenance.`,
                );
                return;
              }

              if (labels.includes('automerge-blocked')) {
                core.info('Skipping because automerge-blocked label is present.');
                return;
              }

              const changedFiles = await github.paginate(
                github.rest.pulls.listFiles,
                {
                  owner,
                  repo,
                  pull_number,
                  per_page: 100,
                },
              );
              const expectedWorkflowContracts = requiredWorkflowContracts.filter(
                (contract) => !contract.expected || contract.expected(changedFiles),
              );
              const workflowByPath = new Map(
                expectedWorkflowContracts.map((contract) => [contract.path, contract]),
              );

              const workflowRuns = await github.paginate(
                github.rest.actions.listWorkflowRunsForRepo,
                {
                  owner,
                  repo,
                  event: 'pull_request',
                  head_sha: pullRequest.head.sha,
                  per_page: 100,
                },
              );
              const latestRunsByName = new Map();

              for (const run of workflowRuns) {
                const contract = workflowByPath.get(normalizeWorkflowPath(run.path));
                if (contract && !latestRunsByName.has(contract.name)) {
                  latestRunsByName.set(contract.name, run);
                }
              }

              const missingWorkflows = expectedWorkflowContracts
                .filter((contract) => !latestRunsByName.has(contract.name))
                .map((contract) => contract.name);
              const incompleteWorkflows = expectedWorkflowContracts
                .filter((contract) => {
                  const run = latestRunsByName.get(contract.name);
                  return run && run.status !== 'completed';
                })
                .map((contract) => contract.name);
              const unsuccessfulWorkflows = expectedWorkflowContracts
                .filter((contract) => {
                  const run = latestRunsByName.get(contract.name);
                  return run?.status === 'completed' && run.conclusion !== 'success';
                })
                .map((contract) => contract.name);

              if (unsuccessfulWorkflows.length > 0) {
                core.setFailed(
                  `Required workflows failed for ${pullRequest.head.sha}: ${JSON.stringify(
                    unsuccessfulWorkflows,
                  )}. Rerun or dispatch Dependency Auto Finish after those checks recover.`,
                );
                return;
              }

              if (missingWorkflows.length > 0 || incompleteWorkflows.length > 0) {
                const state = JSON.stringify({
                  missing: missingWorkflows,
                  incomplete: incompleteWorkflows,
                  unsuccessful: unsuccessfulWorkflows,
                });
                core.info(`Required workflow state for ${pullRequest.head.sha}: ${state}`);

                if (attempt === maxAttempts) {
                  core.setFailed(
                    `Timed out waiting for required workflows on ${pullRequest.head.sha}: ${state}`,
                  );
                  return;
                }

                await sleep(delayMs);
                continue;
              }

              core.info(`Mergeable state on attempt ${attempt}: ${pullRequest.mergeable_state}`);

              if (pullRequest.mergeable_state === 'clean') {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number,
                  sha: pullRequest.head.sha,
                  merge_method: 'squash',
                });
                core.info(`Merged PR #${pull_number}.`);
                return;
              }

              if (pullRequest.mergeable_state === 'behind') {
                if (lane === 'dependabot') {
                  core.info(
                    `Waiting for Dependabot to rebase PR #${pull_number}; a synchronized run will retry auto-merge.`,
                  );
                  return;
                }

                try {
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number,
                    expected_head_sha: pullRequest.head.sha,
                  });
                  core.info(`Queued branch update for PR #${pull_number}.`);
                } catch (error) {
                  const body =
                    'Auto-merge skipped because updating this PR branch from `main` would create a merge conflict or could not be applied cleanly.';
                  await ensureComment(body);
                  await addBlockedLabel(labels);
                  core.info(`Branch update failed for PR #${pull_number}: ${error.message}`);
                }
                return;
              }

              if (attempt === maxAttempts) {
                core.setFailed('PR did not reach a clean mergeable state before the readiness deadline.');
                return;
              }

              await sleep(delayMs);
            }
