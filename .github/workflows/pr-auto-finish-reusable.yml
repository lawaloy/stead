name: PR Auto Finish Reusable

on:
  workflow_call:
    inputs:
      lane:
        required: true
        type: string
      pull_number:
        required: false
        type: number
        default: 0

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Merge PR when ready
        uses: actions/github-script@v7
        env:
          LANE: ${{ inputs.lane }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const lane = process.env.LANE;
            const eventPullNumber = context.payload.workflow_run?.pull_requests?.[0]?.number;
            const inputPullNumber = Number(process.env.PULL_NUMBER || 0);
            const pull_number = eventPullNumber || inputPullNumber;
            const { owner, repo } = context.repo;
            const maxAttempts = 10;
            const delayMs = 15000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const watchedWorkflows = new Set(['ci', 'mobile-ci', 'CodeQL Advanced', 'Dependency review']);

            if (!pull_number) {
              core.info('Skipping because no pull request number was available on the workflow_run payload.');
              return;
            }

            const ensureComment = async (body) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: pull_number,
                per_page: 100,
              });

              if (comments.some((comment) => comment.body === body)) {
                core.info('Skipping comment because the same comment already exists.');
                return;
              }

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pull_number,
                body,
              });
            };

            const addBlockedLabel = async (labels) => {
              if (labels.includes('automerge-blocked')) {
                return;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pull_number,
                labels: ['automerge-blocked'],
              });
            };

            const isTrustedDependabot = (pr) => {
              const authorLogin = pr.user?.login || '';
              const headRef = pr.head?.ref || '';
              return (
                ['dependabot[bot]', 'app/dependabot'].includes(authorLogin) &&
                headRef.startsWith('dependabot/')
              );
            };

            const isTrustedMaintenance = (pr, labels) => {
              const authorLogin = pr.user?.login || '';
              return (
                pr.head.repo?.full_name === `${owner}/${repo}` &&
                pr.base?.ref === 'main' &&
                pr.head?.ref === 'security/deps-maintenance' &&
                ['app/github-actions', 'github-actions[bot]', 'stead-deps-bot[bot]', 'app/stead-deps-bot'].includes(authorLogin) &&
                labels.includes('dependencies') &&
                labels.includes('security')
              );
            };

            const getWatchedCheckState = async (headSha) => {
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              });

              const latestRuns = new Map();
              for (const checkRun of checkRuns) {
                if (!watchedWorkflows.has(checkRun.workflow_name)) {
                  continue;
                }

                const key = `${checkRun.workflow_name}:${checkRun.name}`;
                const previous = latestRuns.get(key);
                if (!previous || checkRun.id > previous.id) {
                  latestRuns.set(key, checkRun);
                }
              }

              const watchedRuns = [...latestRuns.values()];
              const incompleteRuns = watchedRuns.filter((checkRun) => checkRun.status !== 'completed');
              const failingRuns = watchedRuns.filter(
                (checkRun) => checkRun.status === 'completed' && checkRun.conclusion !== 'success',
              );
              const satisfiedWorkflows = new Set(watchedRuns.map((checkRun) => checkRun.workflow_name));
              const missingWorkflows = [...watchedWorkflows].filter((workflowName) => !satisfiedWorkflows.has(workflowName));

              return {
                watchedRuns,
                incompleteRuns,
                failingRuns,
                missingWorkflows,
              };
            };

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const pullRequest = (
                await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number,
                })
              ).data;
              const labels = pullRequest.labels.map((label) => label.name);
              const trusted =
                lane === 'dependabot'
                  ? isTrustedDependabot(pullRequest)
                  : isTrustedMaintenance(pullRequest, labels);

              if (!trusted) {
                core.info(`Skipping because PR does not satisfy trusted ${lane} provenance.`);
                return;
              }

              if (labels.includes('automerge-blocked')) {
                core.info('Skipping because automerge-blocked label is present.');
                return;
              }

              const checkState = await getWatchedCheckState(pullRequest.head.sha);
              if (checkState.missingWorkflows.length > 0) {
                core.info(
                  `Waiting for watched workflows on attempt ${attempt}: ${checkState.missingWorkflows.join(', ')}`,
                );
              } else if (checkState.incompleteRuns.length > 0) {
                core.info(
                  `Waiting for checks on attempt ${attempt}: ${checkState.incompleteRuns
                    .map((checkRun) => `${checkRun.workflow_name}/${checkRun.name}`)
                    .join(', ')}`,
                );
              } else if (checkState.failingRuns.length > 0) {
                core.info(
                  `Skipping because watched checks failed on ${pullRequest.head.sha}: ${checkState.failingRuns
                    .map((checkRun) => `${checkRun.workflow_name}/${checkRun.name}=${checkRun.conclusion}`)
                    .join(', ')}`,
                );
                return;
              } else {
                core.info(`All watched workflow checks are green on ${pullRequest.head.sha}.`);
              }

              core.info(`Mergeable state on attempt ${attempt}: ${pullRequest.mergeable_state}`);

              if (
                checkState.missingWorkflows.length === 0 &&
                checkState.incompleteRuns.length === 0 &&
                checkState.failingRuns.length === 0 &&
                pullRequest.mergeable_state === 'clean'
              ) {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number,
                  merge_method: 'squash',
                });
                core.info(`Merged PR #${pull_number}.`);
                return;
              }

              if (
                checkState.missingWorkflows.length === 0 &&
                checkState.incompleteRuns.length === 0 &&
                checkState.failingRuns.length === 0 &&
                pullRequest.mergeable_state === 'behind'
              ) {
                try {
                  await github.rest.pulls.updateBranch({
                    owner,
                    repo,
                    pull_number,
                    expected_head_sha: pullRequest.head.sha,
                  });
                  core.info(`Queued branch update for PR #${pull_number}.`);
                } catch (error) {
                  const body =
                    'Auto-merge skipped because updating this PR branch from `main` would create a merge conflict or could not be applied cleanly.';
                  await ensureComment(body);
                  await addBlockedLabel(labels);
                  core.info(`Branch update failed for PR #${pull_number}: ${error.message}`);
                }
                return;
              }

              if (attempt === maxAttempts) {
                core.info('PR is not yet fully ready to merge. A later workflow_run will retry.');
                return;
              }

              await sleep(delayMs);
            }
