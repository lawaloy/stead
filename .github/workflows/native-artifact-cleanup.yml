name: Native Artifact Cleanup

on:
  workflow_run:
    workflows: ['native-ci']
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cleanup-superseded-cancellation:
    name: Delete Superseded Native Apps
    if: github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete obsolete simulator applications
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const appArtifactNames = new Set([
              'android-simulator-app',
              'ios-simulator-app',
            ]);

            let obsolete = false;
            let reason = '';

            if (run.event === 'pull_request') {
              let pullNumber = run.pull_requests?.[0]?.number;
              if (!pullNumber) {
                try {
                  const associated = await github.paginate(
                    github.rest.repos.listPullRequestsAssociatedWithCommit,
                    {
                      owner,
                      repo,
                      commit_sha: run.head_sha,
                      per_page: 100,
                    },
                  );
                  const matching = associated.filter((pull) => {
                    const sameBranch = pull.head.ref === run.head_branch;
                    const sameRepository = run.head_repository?.id
                      ? pull.head.repo?.id === run.head_repository.id
                      : pull.head.repo?.full_name ===
                        run.head_repository?.full_name;
                    return sameBranch && sameRepository;
                  });
                  pullNumber =
                    matching.find((pull) => pull.state === 'open')?.number ??
                    matching[0]?.number;
                } catch (error) {
                  core.warning(
                    `Could not resolve a pull request for cancelled run ${run.id}; retaining its applications: ${error.message}`,
                  );
                  return;
                }
              }

              if (!pullNumber) {
                core.warning(
                  `Cancelled pull-request run ${run.id} has no resolvable pull request; retaining its applications.`,
                );
                return;
              }

              let pull;
              try {
                pull = (
                  await github.rest.pulls.get({
                    owner,
                    repo,
                    pull_number: pullNumber,
                  })
                ).data;
              } catch (error) {
                core.warning(
                  `Could not inspect PR #${pullNumber} for cancelled run ${run.id}; retaining its applications: ${error.message}`,
                );
                return;
              }

              if (pull.state !== 'open') {
                obsolete = true;
                reason = `PR #${pullNumber} is ${pull.state}`;
              } else if (pull.head.sha !== run.head_sha) {
                obsolete = true;
                reason = `PR #${pullNumber} advanced to ${pull.head.sha}`;
              } else {
                core.info(
                  `Cancelled run ${run.id} still matches current PR #${pullNumber} head ${run.head_sha}; retaining its applications for rerun.`,
                );
                return;
              }
            } else {
              if (!run.head_branch) {
                core.warning(
                  `Cancelled run ${run.id} has no head branch; retaining its applications.`,
                );
                return;
              }

              try {
                const branch = (
                  await github.rest.repos.getBranch({
                    owner,
                    repo,
                    branch: run.head_branch,
                  })
                ).data;
                if (branch.commit.sha === run.head_sha) {
                  core.info(
                    `Cancelled run ${run.id} still matches current ${run.head_branch} head ${run.head_sha}; retaining its applications for rerun.`,
                  );
                  return;
                }
                obsolete = true;
                reason = `${run.head_branch} advanced to ${branch.commit.sha}`;
              } catch (error) {
                if (error.status === 404) {
                  obsolete = true;
                  reason = `${run.head_branch} was deleted`;
                } else {
                  core.warning(
                    `Could not inspect ${run.head_branch} for cancelled run ${run.id}; retaining its applications: ${error.message}`,
                  );
                  return;
                }
              }
            }

            if (!obsolete) {
              core.warning(
                `No safe cleanup decision was produced for cancelled run ${run.id}; retaining its applications.`,
              );
              return;
            }

            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner,
                repo,
                run_id: run.id,
                per_page: 100,
              },
            );
            const applications = artifacts.filter(
              (artifact) =>
                !artifact.expired && appArtifactNames.has(artifact.name),
            );

            if (applications.length === 0) {
              core.info(
                `Cancelled run ${run.id} is obsolete (${reason}) and has no live simulator application artifacts.`,
              );
              return;
            }

            for (const artifact of applications) {
              try {
                await github.rest.actions.deleteArtifact({
                  owner,
                  repo,
                  artifact_id: artifact.id,
                });
                core.info(
                  `Deleted ${artifact.name} (${artifact.id}) from obsolete cancelled run ${run.id}: ${reason}.`,
                );
              } catch (error) {
                if (error.status === 404) {
                  core.info(
                    `${artifact.name} (${artifact.id}) was already deleted or expired.`,
                  );
                  continue;
                }
                throw error;
              }
            }
