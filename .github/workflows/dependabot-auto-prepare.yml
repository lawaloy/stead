name: Dependabot Auto Prepare

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Dependabot provenance
        id: provenance
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const authorLogin = context.payload.pull_request.user.login;
            const headRef = context.payload.pull_request.head.ref;
            const isDependabotAuthor =
              authorLogin === 'dependabot[bot]' || authorLogin === 'app/dependabot';
            const isDependabotBranch = headRef.startsWith('dependabot/');
            const trusted = isDependabotAuthor && isDependabotBranch;

            core.setOutput('trusted', String(trusted));
            core.info(
              `Dependabot provenance: author=${authorLogin}, branch=${headRef}, trusted=${trusted}`,
            );

      - name: Generate GitHub App token
        if: steps.provenance.outputs.trusted == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        if: steps.provenance.outputs.trusted == 'true'
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Check manual block label
        if: steps.provenance.outputs.trusted == 'true'
        id: policy
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const blocked = labels.includes('automerge-blocked');

            core.setOutput('allowed', String(!blocked));
            core.setOutput('blocked', String(blocked));

            if (blocked) {
              core.info('Auto-merge disabled by automerge-blocked label.');
            }

      - name: Auto-approve safe updates
        if: |
          steps.provenance.outputs.trusted == 'true' &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          steps.policy.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;
            const headSha = context.payload.pull_request.head.sha;
            const botLogin = 'stead-deps-bot[bot]';
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number,
              per_page: 100,
            });

            const alreadyApproved = reviews.some((review) =>
              review.user?.login === botLogin &&
              review.state === 'APPROVED' &&
              review.commit_id === headSha,
            );

            if (alreadyApproved) {
              core.info('Skipping auto-approval because the bot already approved this head commit.');
              return;
            }

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'Auto-approving safe Dependabot update.'
              });
            } catch (error) {
              if (!String(error.message).includes('Can not approve your own pull request')) {
                throw error;
              }
            }

      - name: Comment when auto-merge is skipped
        if: |
          steps.provenance.outputs.trusted == 'true' &&
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          steps.policy.outputs.allowed != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const body = 'Auto-merge skipped because the `automerge-blocked` label is present.';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            if (comments.some((comment) => comment.body === body)) {
              core.info('Skipping blocked comment because the same comment already exists.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
