name: native-ci

# Every PR and main-branch push produces a stable native-ci readiness signal.
# The config job skips expensive native jobs when they are irrelevant.
# Scheduled and manual runs always execute the full suite. Native binaries are
# built in dedicated jobs and handed to Maestro jobs as artifacts (build once
# → test). Warm Android boots use a cached AVD
# snapshot; iOS uses mtime/inode-aware DerivedData + Pods caches when the
# .app misses.

on:
  workflow_dispatch:
  # After Dependabot + Dependency Maintenance (13:00 UTC) and Dependency
  # Audit (13:30 UTC), leave room for PR CI and auto-merge onto main before
  # the daily native smoke. Main pushes also produce the readiness signal.
  schedule:
    - cron: '0 16 * * *'
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      run_native: ${{ steps.decision.outputs.run_native }}
      node_version: ${{ steps.versions.outputs.node_version }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      android_api_level: ${{ steps.versions.outputs.android_api_level }}
      ios_runner: ${{ steps.versions.outputs.ios_runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect native-impacting changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/native-ci-paths.yml
      - name: Resolve native execution decision
        id: decision
        env:
          CHANGED: ${{ steps.changes.outputs.native }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            echo "run_native=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "run_native=true" >> "$GITHUB_OUTPUT"
          fi
      - id: versions
        run: |
          set -eu
          source .github/ci.env
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_api_level=$ANDROID_API_LEVEL" >> "$GITHUB_OUTPUT"
          echo "ios_runner=$IOS_RUNNER" >> "$GITHUB_OUTPUT"

  build-android:
    needs: config
    if: needs.config.outputs.run_native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v5
      - name: Restore Android simulator app
        id: android-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          # The build recipe lives inline in this workflow and its toolchain
          # pins in ci.env, so both are part of the key: a build-only change
          # must not reuse an APK produced by the old recipe.
          key: android-simulator-app-v3-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**', 'mobile/app/**', 'mobile/src/**', '.github/ci.env', '.github/workflows/native-ci.yml') }}
      - name: Build Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix mobile
          cd mobile
          CI=1 npx expo prebuild --platform android --no-install
          cd android
          ./gradlew app:assembleDebug
          mkdir -p ../.ci/android
          cp app/build/outputs/apk/debug/app-debug.apk ../.ci/android/stead-debug.apk
      - name: Save Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          key: ${{ steps.android-app-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android/stead-debug.apk
          if-no-files-found: error
          retention-days: 1

  build-ios:
    needs: config
    if: needs.config.outputs.run_native == 'true'
    runs-on: ${{ needs.config.outputs.ios_runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # Resolved before the app-cache restore so the cached .app is keyed on
      # the Xcode that built it (runner images can change Xcode in place).
      - name: Resolve Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Restore iOS simulator app
        id: ios-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ci/ios/mobile.app
          # Include the build script, toolchain pins, and this workflow so a
          # build-only change must rebuild instead of reusing a stale .app.
          key: ios-simulator-app-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-v3-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**', 'mobile/app/**', 'mobile/src/**', '.github/scripts/build-ios-simulator-app.sh', '.github/ci.env', '.github/workflows/native-ci.yml') }}
      - name: Restore source mtimes for incremental Xcode
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: chetan/git-restore-mtime-action@v2
      - name: Install mobile dependencies
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix mobile
      - name: Prebuild iOS project
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: CI=1 npx expo prebuild --platform ios --no-install
      - name: Cache CocoaPods
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ needs.config.outputs.ios_runner }}-${{ hashFiles('mobile/ios/Podfile.lock', 'mobile/package-lock.json') }}
          restore-keys: |
            ios-pods-${{ needs.config.outputs.ios_runner }}-
      - name: Set DerivedData path
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: derived
        run: echo "path=${RUNNER_TEMP}/DerivedData" >> "$GITHUB_OUTPUT"
      - name: Cache Xcode DerivedData (mtime + inode aware)
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: irgaly/xcode-cache@v1
        with:
          key: ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-
          deriveddata-directory: ${{ steps.derived.outputs.path }}
      - name: Build iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        env:
          DERIVED_DATA_PATH: ${{ steps.derived.outputs.path }}
        run: bash .github/scripts/build-ios-simulator-app.sh
      - name: Save iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ci/ios/mobile.app
          key: ${{ steps.ios-app-cache.outputs.cache-primary-key }}
      - name: Package iOS app zip for artifact transfer
        run: |
          set -eu
          test -d mobile/.ci/ios/mobile.app
          test -f mobile/.ci/ios/mobile.app/Info.plist
          rm -f mobile/.ci/ios/mobile.app.zip
          # Zip preserves .app layout across Actions artifact upload/download.
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/.ci/ios/mobile.app \
            mobile/.ci/ios/mobile.app.zip
          ls -lh mobile/.ci/ios/mobile.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/.ci/ios/mobile.app.zip
          if-no-files-found: error
          retention-days: 1

  native-android:
    needs: [config, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stead
          POSTGRES_PASSWORD: stead
          POSTGRES_DB: stead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stead -d stead"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_E2E_PHONE: '08030000001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json
      - name: Download Android simulator app
        uses: actions/download-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android
      - name: Restore Android Metro transforms
        uses: actions/cache@v4
        with:
          path: mobile/.cache/metro
          key: metro-android-v1-${{ hashFiles('mobile/package-lock.json', 'mobile/metro.config.js', 'mobile/babel.config.js') }}
      - name: Cache Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-ubuntu-v1
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies and prepare API
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix api
          npm ci --prefix mobile
          cd api
          npx prisma migrate deploy
          npm run build
      - name: Start API and Metro
        run: |
          NODE_ENV=test node api/dist/src/main.js > "$RUNNER_TEMP/stead-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/auth/countries > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/auth/countries > /dev/null
          (cd mobile && NODE_OPTIONS=--dns-result-order=ipv4first npx expo start --localhost) > "$RUNNER_TEMP/stead-metro.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'
          # Prewarm the exact bundle the app requests (see the iOS job for why the
          # URL must go through Expo's virtual entry). Query string mirrors
          # DevServerHelper.createBundleURL in RN 0.86.
          nohup bash -c 'curl --fail --silent --show-error --retry 3 \
            "http://127.0.0.1:8081/.expo/.virtual-metro-entry.bundle?platform=android&dev=true&lazy=true&minify=false&app=com.lawaloy.stead&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server" \
            --output "$RUNNER_TEMP/stead-android.bundle"; echo $? > "$RUNNER_TEMP/stead-metro-prewarm.exit"' \
            > "$RUNNER_TEMP/stead-metro-prewarm.log" 2>&1 &
      - name: Install Maestro
        run: bash .github/scripts/install-maestro.sh
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ needs.config.outputs.android_api_level }}-x86_64-v1
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.config.outputs.android_api_level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Wait for Metro prewarm
        run: |
          set -eu
          # The prewarm runs in the background while Maestro and the AVD are set up.
          # Let it finish before the app launches so the app's request is a cache hit.
          for attempt in $(seq 1 300); do
            if [[ -f "$RUNNER_TEMP/stead-metro-prewarm.exit" ]]; then break; fi
            sleep 2
          done
          if [[ "$(cat "$RUNNER_TEMP/stead-metro-prewarm.exit" 2>/dev/null)" != 0 ]]; then
            echo "Metro prewarm failed or did not finish" >&2
            cat "$RUNNER_TEMP/stead-metro-prewarm.log" >&2 || true
            cat "$RUNNER_TEMP/stead-metro.log" >&2 || true
            exit 1
          fi
          test -s "$RUNNER_TEMP/stead-android.bundle"
      - name: Run Android native journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.config.outputs.android_api_level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile
          script: bash ../.github/scripts/run-android-native-journey.sh
      - name: Check Metro reused the prewarmed bundle
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-metro-bundle-reuse.sh Android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-native-journey-logs
          path: |
            ${{ runner.temp }}/stead-api.log
            ${{ runner.temp }}/stead-metro.log
            ${{ runner.temp }}/stead-metro-prewarm.log
            ~/.maestro/tests
            mobile/.expo
          retention-days: 7

  native-ios:
    needs: [config, build-ios]
    runs-on: ${{ needs.config.outputs.ios_runner }}
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_E2E_PHONE: '08030000001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json
      - name: Download iOS simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/.ci/ios
      - name: Unpack iOS simulator app
        run: |
          set -eu
          cd mobile/.ci/ios
          test -f mobile.app.zip
          rm -rf mobile.app
          ditto -x -k mobile.app.zip .
          APP_PATH="$(find "$PWD" -path '*/mobile.app/Info.plist' -print -quit | sed 's#/Info.plist$##')"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          # Normalize to a stable path for later steps.
          if [[ "$APP_PATH" != "$PWD/mobile.app" ]]; then
            rm -rf "$PWD/mobile.app"
            ditto "$APP_PATH" "$PWD/mobile.app"
          fi
          test -f "$PWD/mobile.app/Info.plist"
          echo "Unpacked $PWD/mobile.app"
      - name: Boot iOS simulator
        run: |
          set -eu
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name == "iPhone 17")] | last | .udid')"
          test -n "$DEVICE_ID" && test "$DEVICE_ID" != null
          echo "IOS_DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          # Boot now, in the background, so the cold simulator does its first-boot work
          # (data migration, system apps) while dependencies install and the API and
          # Metro start, instead of right before Maestro needs it.
          nohup xcrun simctl boot "$DEVICE_ID" > "$RUNNER_TEMP/simctl-boot.log" 2>&1 &
      - name: Restore iOS Metro transforms
        uses: actions/cache@v4
        with:
          path: mobile/.cache/metro
          key: metro-ios-v1-${{ hashFiles('mobile/package-lock.json', 'mobile/metro.config.js', 'mobile/babel.config.js') }}
      - name: Cache Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-macos-v1
      - name: Start PostgreSQL 16
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: stead
          password: stead
          database: stead
          postgres-version: '16'
      - name: Install dependencies and prepare API
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix api
          npm ci --prefix mobile
          cd api
          npx prisma migrate deploy
          npm run build
      - name: Start API and Metro
        run: |
          NODE_ENV=test node api/dist/src/main.js > "$RUNNER_TEMP/stead-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/auth/countries > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/auth/countries > /dev/null
          (cd mobile && NODE_OPTIONS=--dns-result-order=ipv4first npx expo start --localhost) > "$RUNNER_TEMP/stead-metro.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'
      - name: Install Maestro
        run: bash .github/scripts/install-maestro.sh
      - name: Install app on simulator
        run: |
          set -eu
          DEVICE_ID="$IOS_DEVICE_ID"
          # Waits for the background boot (or boots if it failed). When the boot has
          # already finished, bootstatus only prints "already booted" and does not wait
          # for system apps, so also prove SpringBoard can launch an app.
          cat "$RUNNER_TEMP/simctl-boot.log" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          for attempt in $(seq 1 30); do
            if xcrun simctl launch "$DEVICE_ID" com.apple.Preferences > /dev/null 2>&1; then break; fi
            sleep 5
          done
          xcrun simctl launch "$DEVICE_ID" com.apple.Preferences
          xcrun simctl terminate "$DEVICE_ID" com.apple.Preferences || true
          APP_PATH=mobile/.ci/ios/mobile.app
          test -d "$APP_PATH"
          test -f "$APP_PATH/Info.plist"
          # Cold simulator boots can need a beat before install succeeds.
          for attempt in 1 2 3 4 5; do
            if xcrun simctl install "$DEVICE_ID" "$APP_PATH"; then
              break
            fi
            if [[ "$attempt" -eq 5 ]]; then
              echo "simctl install failed after retries" >&2
              ls -la "$APP_PATH" >&2 || true
              exit 1
            fi
            sleep 5
          done
          # Ensure Metro has built the exact bundle the app will request before
          # Maestro launches, so the app's request is served from Metro's cache.
          # The app asks for Expo's virtual entry (.expo/.virtual-metro-entry), which
          # @expo/metro-config rewrites to node_modules/expo-router/entry and fills in
          # transform options (transform.routerRoot=app plus the Hermes options).
          # Requesting expo-router/entry directly skipped that rewrite, so the prewarm
          # had no transform.routerRoot, Metro treated the app's request as a different
          # bundle and transformed every module again (up to ~128s), and the app gave up
          # with "Could not connect to development server".
          # Query string mirrors RCTBundleURLProvider in RN 0.86 (the RCTMultipartDataTask
          # GET in the simulator log); check-metro-bundle-reuse.sh fails if it drifts.
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          test -n "$BUNDLE_ID"
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "http://127.0.0.1:8081/.expo/.virtual-metro-entry.bundle?platform=ios&dev=true&lazy=true&minify=false&inlineSourceMap=false&modulesOnly=false&runModule=true&excludeSource=true&sourcePaths=url-server&app=${BUNDLE_ID}" \
            --output "$RUNNER_TEMP/stead-ios.bundle" \
            > "$RUNNER_TEMP/stead-metro-prewarm.log" 2>&1 \
            || {
              cat "$RUNNER_TEMP/stead-metro-prewarm.log" >&2 || true
              cat "$RUNNER_TEMP/stead-metro.log" >&2 || true
              exit 1
            }
          test -s "$RUNNER_TEMP/stead-ios.bundle"
      - name: Warm up Maestro iOS driver
        env:
          # Applies to this warm-up only. The first XCTest runner launch on a freshly
          # booted simulator is the slow one (run 37712983199 attempt 1: about 122s from
          # xcodebuild to a ready driver vs about 40s in passing runs), so pay it here
          # with room to spare. The real test keeps Maestro's default 120s limit.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '300000'
        run: |
          set -eu
          touch "$RUNNER_TEMP/maestro-sessions.marker"
          # `maestro hierarchy` starts the driver on the device, reads the screen and
          # stops. That installs and launches the XCTest runner once, so the journey's
          # own driver start is a warm one.
          for attempt in 1 2; do
            started=$(date +%s)
            if maestro --device "$IOS_DEVICE_ID" hierarchy > "$RUNNER_TEMP/maestro-warmup-hierarchy.json" 2> "$RUNNER_TEMP/maestro-warmup.log"; then
              echo "Maestro iOS driver warm-up finished in $(( $(date +%s) - started ))s (attempt $attempt)"
              exit 0
            fi
            echo "Maestro iOS driver warm-up attempt $attempt failed after $(( $(date +%s) - started ))s:" >&2
            tail -n 40 "$RUNNER_TEMP/maestro-warmup.log" >&2 || true
          done
          exit 1
      - name: Run iOS native journey
        working-directory: mobile
        run: maestro test -e TEST_PHONE=08030000001 .maestro/critical-native-journey.yaml
      - name: Report Maestro iOS driver startup
        if: ${{ !cancelled() }}
        run: bash .github/scripts/report-maestro-ios-driver-startup.sh "$RUNNER_TEMP/maestro-sessions.marker"
      - name: Check Metro reused the prewarmed bundle
        if: ${{ !cancelled() }}
        run: bash .github/scripts/check-metro-bundle-reuse.sh iOS
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-native-journey-logs
          path: |
            ${{ runner.temp }}/stead-api.log
            ${{ runner.temp }}/stead-metro.log
            ${{ runner.temp }}/stead-metro-prewarm.log
            ~/.maestro/tests
            mobile/.expo
            mobile/.ci/ios
          retention-days: 7
