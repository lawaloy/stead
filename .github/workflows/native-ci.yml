name: native-ci
run-name: >-
  native-ci / ${{ github.event_name == 'workflow_dispatch' && inputs.platform || github.event_name }} /
  ${{ github.event.pull_request.number && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}

# Every PR and main-branch push produces a stable native-ci readiness signal.
# The config job skips expensive native jobs when they are irrelevant,
# including draft pull requests. Native Readiness still passes on drafts,
# and the jobs run when the PR is marked ready for review.
# IOS_NATIVE_ENABLED is an emergency switch; native-readiness fails relevant
# PRs when iOS is disabled so missing coverage cannot look green.
# Simulator app artifacts are deleted when both journey jobs succeed or
# are skipped, including after a later successful rerun. They are kept
# for 1 day when a journey fails or a current-head run is cancelled so
# "Re-run failed jobs" can still download the apps. The completion cleanup
# deletes applications from cancelled runs once their PR or branch advances.
# Journey logs are uploaded only when a test fails.
# Manual runs can select a platform. Native binaries are
# built in dedicated jobs and handed to Maestro jobs as artifacts (build once
# → test). Android boots a dedicated AVD from checksum-locked SDK archives;
# iOS uses mtime/inode-aware DerivedData + Pods caches when the .app misses.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platforms to validate
        type: choice
        options: [all, ios, android]
        default: all
      scenario:
        description: Full journey, or an iOS diagnostic probe (no Native Readiness pass)
        type: choice
        options: [journey, sign-in, input]
        default: journey
      ios_samples:
        description: Independent fresh macOS hosts (each result is retained)
        type: choice
        options: ['1', '3']
        default: '1'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    name: Native CI Configuration
    runs-on: ubuntu-24.04
    outputs:
      run_native: ${{ steps.decision.outputs.run_native }}
      node_version: ${{ steps.versions.outputs.node_version }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      android_api_level: ${{ steps.versions.outputs.android_api_level }}
      ios_runner: ${{ steps.versions.outputs.ios_runner }}
      ios_enabled: ${{ steps.versions.outputs.ios_enabled }}
      maestro_version: ${{ steps.versions.outputs.maestro_version }}
      maestro_sha256: ${{ steps.versions.outputs.maestro_sha256 }}
      java_version: ${{ steps.versions.outputs.java_version }}
      ruby_version: ${{ steps.versions.outputs.ruby_version }}
      bundler_version: ${{ steps.versions.outputs.bundler_version }}
      postgres_version: ${{ steps.versions.outputs.postgres_version }}
      postgres_image: ${{ steps.versions.outputs.postgres_image }}
      emulator_build: ${{ steps.versions.outputs.emulator_build }}
      image_target: ${{ steps.versions.outputs.image_target }}
      android_arch: ${{ steps.versions.outputs.android_arch }}
      android_profile: ${{ steps.versions.outputs.android_profile }}
      native_evidence_retention_days: ${{ steps.versions.outputs.native_evidence_retention_days }}
      android_build_fingerprint: ${{ steps.versions.outputs.android_build_fingerprint }}
      ios_build_fingerprint: ${{ steps.versions.outputs.ios_build_fingerprint }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect native-impacting changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/native-ci-paths.yml
      - name: Resolve native execution decision
        id: decision
        env:
          CHANGED: ${{ steps.changes.outputs.native }}
          EVENT_NAME: ${{ github.event_name }}
          SCENARIO: ${{ inputs.scenario || 'journey' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [[ "$SCENARIO" != "journey" && "$PLATFORM" != "ios" ]]; then
            echo "Diagnostic probes require platform=ios." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "pull_request" && "$DRAFT" == "true" ]]; then
            echo "run_native=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            echo "run_native=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "run_native=true" >> "$GITHUB_OUTPUT"
          fi
      - id: versions
        run: |
          set -eu
          source .github/ci.env
          android_build_fingerprint="$(
            printf '%s\0' \
              "$NATIVE_BUILD_CACHE_SCHEMA" \
              "$NODE_VERSION" "$NPM_VERSION" "$NATIVE_API_TIMEOUT_MS" \
              "$JAVA_DISTRIBUTION" "$JAVA_VERSION" \
              "$ANDROID_BUILD_TOOLS_VERSION" \
              "$ANDROID_MODULE_BUILD_TOOLS_VERSION" "$ANDROID_COMPILE_SDK" \
              "$ANDROID_NDK_VERSION" "$ANDROID_CMAKE_VERSION" "$GRADLE_VERSION" \
              | sha256sum | cut -d ' ' -f 1
          )"
          ios_build_fingerprint="$(
            printf '%s\0' \
              "$NATIVE_BUILD_CACHE_SCHEMA" \
              "$NODE_VERSION" "$NPM_VERSION" "$NATIVE_API_TIMEOUT_MS" \
              "$IOS_RUNNER" "$XCODE_VERSION" "$XCODE_BUILD" \
              "$RUBY_VERSION" "$BUNDLER_VERSION" "$COCOAPODS_VERSION" \
              "$REACT_NATIVE_MAVEN_REPOSITORY" \
              | sha256sum | cut -d ' ' -f 1
          )"
          {
            echo "node_version=$NODE_VERSION"
            echo "npm_version=$NPM_VERSION"
            echo "android_api_level=$ANDROID_API_LEVEL"
            echo "ios_runner=$IOS_RUNNER"
            echo "ios_enabled=$IOS_NATIVE_ENABLED"
            echo "maestro_version=$MAESTRO_VERSION"
            echo "maestro_sha256=$MAESTRO_SHA256"
            echo "java_version=$JAVA_VERSION"
            echo "ruby_version=$RUBY_VERSION"
            echo "bundler_version=$BUNDLER_VERSION"
            echo "postgres_version=$POSTGRES_VERSION"
            echo "postgres_image=$POSTGRES_IMAGE"
            echo "emulator_build=$ANDROID_EMULATOR_BUILD"
            echo "image_target=$ANDROID_IMAGE_TARGET"
            echo "android_arch=$ANDROID_ARCH"
            echo "android_profile=$ANDROID_PROFILE"
            echo "native_evidence_retention_days=$NATIVE_EVIDENCE_RETENTION_DAYS"
            echo "android_build_fingerprint=$android_build_fingerprint"
            echo "ios_build_fingerprint=$ios_build_fingerprint"
          } >> "$GITHUB_OUTPUT"
          if [[ "$IOS_NATIVE_ENABLED" != "true" ]]; then
            echo "Native iOS builds and journeys are disabled by the emergency switch. Native Readiness will reject applicable changes." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-android:
    needs: config
    if: needs.config.outputs.run_native == 'true' && inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android simulator app
        id: android-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          # Hash application/build inputs only. Test files, evidence settings,
          # and workflow orchestration cannot change the produced APK.
          key: android-simulator-app-${{ needs.config.outputs.android_build_fingerprint }}-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/babel.config.js', 'mobile/metro.config.js', 'mobile/tsconfig.json', 'mobile/assets/**', 'mobile/app/**', 'mobile/src/**', '!mobile/src/__tests__/**', '!mobile/src/**/*.test.*', '!mobile/src/**/*.spec.*', 'scripts/native-*.mjs', 'scripts/android-*.mjs', '!scripts/*.test.mjs', 'scripts/archive-utils.mjs', '.github/android-sdk-lock.json', 'scripts/process-utils.mjs', 'scripts/local-workflow.mjs', 'scripts/toolchain.mjs') }}
      - uses: actions/setup-node@v4
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java_version }}
      - name: Cache Gradle dependencies and build outputs
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: gradle/actions/setup-gradle@v5
      - name: Install Android build dependencies
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
          npm ci --prefix mobile
      - name: Cache locked Android SDK
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .tmp/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/android-sdk-lock.json') }}
      - name: Install locked Android SDK
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: npm run tools:install:android -- --accept-licenses
      - name: Build Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: npm run native -- build --platform android
      - name: Save Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          key: ${{ steps.android-app-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android/stead-debug.apk
          if-no-files-found: error
          retention-days: 1

  build-ios:
    needs: config
    if: needs.config.outputs.run_native == 'true' && needs.config.outputs.ios_enabled == 'true' && inputs.platform != 'android'
    runs-on: ${{ needs.config.outputs.ios_runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install shared runner dependencies
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
      - name: Select pinned Xcode and simulator
        run: npm run native -- setup --platform ios
      # Resolved before the app-cache restore so the cached .app is keyed on
      # the Xcode that built it (runner images can change Xcode in place).
      - name: Resolve Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Restore iOS simulator app
        id: ios-app-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            mobile/.ci/ios/mobile.app
            mobile/.ci/ios/stead-native-config.json
          # Hash application/build inputs only. Test files, evidence settings,
          # and workflow orchestration cannot change the produced app.
          key: ios-simulator-app-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ needs.config.outputs.ios_build_fingerprint }}-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/babel.config.js', 'mobile/metro.config.js', 'mobile/tsconfig.json', 'mobile/assets/**', 'mobile/app/**', 'mobile/src/**', '!mobile/src/__tests__/**', '!mobile/src/**/*.test.*', '!mobile/src/**/*.spec.*', '.github/scripts/build-ios-simulator-app.sh', 'scripts/native-*.mjs', '!scripts/*.test.mjs', 'scripts/archive-utils.mjs', 'scripts/ios-setup.mjs', 'scripts/process-utils.mjs', 'scripts/local-workflow.mjs', 'scripts/ios-simulator-entitlements.mjs', 'scripts/toolchain.mjs', 'mobile/Gemfile', 'mobile/Gemfile.lock') }}
      - uses: ruby/setup-ruby@v1
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        with:
          ruby-version: ${{ needs.config.outputs.ruby_version }}
          bundler: ${{ needs.config.outputs.bundler_version }}
          bundler-cache: true
          working-directory: mobile
      - name: Restore source mtimes for incremental Xcode
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: chetan/git-restore-mtime-action@v2
      - name: Cache iOS JavaScript transforms
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: mobile/.cache/metro
          key: metro-ios-v2-${{ hashFiles('mobile/package-lock.json', 'mobile/metro.config.js', 'mobile/babel.config.js') }}
      - name: Install mobile dependencies
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --prefix mobile
      - name: Prebuild iOS project
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: CI=1 EXPO_NO_DOTENV=1 npx expo prebuild --platform ios --no-install
      - name: Resolve React Native version
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: react-native
        run: |
          version="$(node -p 'require("./mobile/package-lock.json").packages["node_modules/react-native"].version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore React Native iOS binaries
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: react-native-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: react-native-ios-${{ runner.os }}-${{ runner.arch }}-v1-${{ steps.react-native.outputs.version }}
      - name: Cache CocoaPods
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ needs.config.outputs.ios_runner }}-${{ hashFiles('mobile/ios/Podfile.lock', 'mobile/package-lock.json', 'mobile/Gemfile.lock') }}
          restore-keys: |
            ios-pods-${{ needs.config.outputs.ios_runner }}-
      - name: Prepare iOS dependencies
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-ios-simulator-app.sh --prepare-only
      - name: Save React Native iOS binaries
        if: steps.ios-app-cache.outputs.cache-hit != 'true' && steps.react-native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ReactNative
          key: ${{ steps.react-native-cache.outputs.cache-primary-key }}
      - name: Set DerivedData path
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: derived
        run: echo "path=${RUNNER_TEMP}/DerivedData" >> "$GITHUB_OUTPUT"
      - name: Cache Xcode DerivedData (mtime + inode aware)
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: irgaly/xcode-cache@v1
        with:
          key: ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-
          deriveddata-directory: ${{ steps.derived.outputs.path }}
      - name: Build iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        env:
          DERIVED_DATA_PATH: ${{ steps.derived.outputs.path }}
          IOS_PODS_PREPARED: true
        run: npm run native -- build --platform ios --project-ready
      - name: Save iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            mobile/.ci/ios/mobile.app
            mobile/.ci/ios/stead-native-config.json
          key: ${{ steps.ios-app-cache.outputs.cache-primary-key }}
      - name: Package iOS app zip for artifact transfer
        run: |
          set -eu
          test -d mobile/.ci/ios/mobile.app
          test -f mobile/.ci/ios/mobile.app/Info.plist
          test -f mobile/.ci/ios/stead-native-config.json
          rm -f mobile/.ci/ios/mobile.app.zip
          # Zip preserves .app layout across Actions artifact upload/download.
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/.ci/ios/mobile.app \
            mobile/.ci/ios/mobile.app.zip
          ls -lh mobile/.ci/ios/mobile.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: |
            mobile/.ci/ios/mobile.app.zip
            mobile/.ci/ios/stead-native-config.json
          if-no-files-found: error
          retention-days: 1

  native-android:
    needs: [config, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ needs.config.outputs.postgres_image }}
        env:
          POSTGRES_USER: stead
          POSTGRES_PASSWORD: stead
          POSTGRES_DB: stead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stead -d stead"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      AUTH_OTP_VERIFICATION_ENCRYPTION_KEY: stead-native-ci-otp-verification-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_E2E_PHONE: '08030000001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - name: Download Android simulator app
        uses: actions/download-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android
      - name: Install shared runner command
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Restore Android container build cache
        uses: actions/cache@v4
        with:
          path: .tmp/android-buildkit-cache
          key: android-container-buildkit-${{ runner.os }}-v1-${{ hashFiles('.github/native-container/**', '.github/ci.env', '.github/android-sdk-lock.json', 'package.json', 'package-lock.json', 'api/package.json', 'api/package-lock.json', 'api/prisma.config.ts', 'api/prisma/**', 'mobile/package.json', 'mobile/package-lock.json', 'scripts/install-maestro.mjs', 'scripts/android-sdk.mjs', 'scripts/archive-utils.mjs', 'scripts/toolchain.mjs', 'scripts/process-utils.mjs') }}
      - name: Run Android native journey
        env:
          STEAD_ANDROID_BUILDKIT_CACHE: ${{ github.workspace }}/.tmp/android-buildkit-cache
        run: npm run native -- test --platform android --android-runner container --database-ready --app mobile/.ci/android/stead-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-native-journey-logs
          include-hidden-files: true
          path: |
            .tmp/native-container/**/attempt-*/**
            .tmp/native-container/**/attempts.json
            .tmp/native-container/**/build.log
            .tmp/native-container/**/source.json
            !.tmp/native-container/**/*.bundle
            !.tmp/native-container/**/*.apk
            !.tmp/native-container/**/*.aab
            !.tmp/native-container/**/*.zip
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.native_evidence_retention_days }}

  native-ios:
    name: ${{ matrix.sample == 1 && 'native-ios' || format('native-ios-{0}', matrix.sample) }}
    needs: [config, build-ios]
    if: needs.config.outputs.run_native == 'true' && needs.config.outputs.ios_enabled == 'true' && inputs.platform != 'android'
    runs-on: ${{ needs.config.outputs.ios_runner }}
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJSON(inputs.ios_samples == '3' && '[1,2,3]' || '[1]') }}
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      AUTH_OTP_VERIFICATION_ENCRYPTION_KEY: stead-native-ci-otp-verification-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_E2E_PHONE: '08030000001'
      STEAD_IOS_HOST_SAMPLE: ${{ matrix.sample }}
      STEAD_NATIVE_SCENARIO: ${{ inputs.scenario || 'journey' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java_version }}
      - name: Install shared runner dependencies
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
      - name: Download iOS simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/.ci/ios
      - name: Unpack iOS simulator app
        run: |
          set -eu
          cd mobile/.ci/ios
          test -f mobile.app.zip
          rm -rf mobile.app
          ditto -x -k mobile.app.zip .
          APP_PATH="$(find "$PWD" -path '*/mobile.app/Info.plist' -print -quit | sed 's#/Info.plist$##')"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          # Normalize to a stable path for later steps.
          if [[ "$APP_PATH" != "$PWD/mobile.app" ]]; then
            rm -rf "$PWD/mobile.app"
            ditto "$APP_PATH" "$PWD/mobile.app"
          fi
          test -f "$PWD/mobile.app/Info.plist"
          echo "Unpacked $PWD/mobile.app"
      - name: Cache Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-macos-${{ needs.config.outputs.maestro_version }}-${{ needs.config.outputs.maestro_sha256 }}-v3
      - name: Cache pinned PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: .tmp/tools/postgres
          key: postgres-source-${{ runner.os }}-${{ runner.arch }}-${{ needs.config.outputs.postgres_version }}-${{ hashFiles('.github/ci.env', '.github/scripts/install-native-postgres.sh') }}
      - name: Install pinned PostgreSQL
        run: bash .github/scripts/install-native-postgres.sh
      - name: Start isolated PostgreSQL
        env:
          PGPASSWORD: stead
        run: |
          node --input-type=module -e "import { assertPortAvailable } from './scripts/process-utils.mjs'; await assertPortAvailable(5432)"
          PG_TEST_DATA="$RUNNER_TEMP/stead-native-postgres"
          PG_TEST_PASSWORD="$RUNNER_TEMP/stead-native-postgres-password"
          printf '%s\n' 'stead' > "$PG_TEST_PASSWORD"
          chmod 600 "$PG_TEST_PASSWORD"
          initdb --pgdata="$PG_TEST_DATA" --username=stead --pwfile="$PG_TEST_PASSWORD" --auth=scram-sha-256 --encoding=UTF8 --locale=en_US.UTF-8
          pg_ctl -D "$PG_TEST_DATA" -l "$RUNNER_TEMP/stead-native-postgres.log" -o '-h 127.0.0.1 -p 5432' -w start
          createdb -h 127.0.0.1 -U stead stead
      - name: Install API dependencies
        run: npm ci --prefix api
      - name: Install Maestro
        run: bash .github/scripts/install-maestro.sh
      - name: Run iOS native journey
        run: |
          npm run native -- setup --platform ios
          npm run native -- test --platform ios --database-ready --app mobile/.ci/ios/mobile.app --scenario "$STEAD_NATIVE_SCENARIO"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ${{ matrix.sample == 1 && 'ios-native-journey-logs' || format('ios-native-journey-logs-{0}', matrix.sample) }}
          include-hidden-files: true
          path: |
            .tmp/native-validation
            ~/.maestro/tests
            mobile/.expo/**/*.log
            !.tmp/native-validation/**/*.bundle
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.native_evidence_retention_days }}

  native-readiness:
    # A skipped required check counts as passing in GitHub. Give diagnostic
    # runs a different check name instead of skipping Native Readiness.
    name: ${{ inputs.scenario && inputs.scenario != 'journey' && 'iOS Diagnostic Probe' || 'Native Readiness' }}
    # Aggregate failures and ordinary skips, but do not keep an obsolete or
    # manually cancelled workflow alive through an always() job.
    if: ${{ always() && !cancelled() }}
    needs: [config, build-android, build-ios, native-android, native-ios]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Require every applicable native platform
        env:
          CONFIG_RESULT: ${{ needs.config.result }}
          RUN_NATIVE: ${{ needs.config.outputs.run_native }}
          IOS_ENABLED: ${{ needs.config.outputs.ios_enabled }}
          REQUESTED_PLATFORM: ${{ inputs.platform || 'all' }}
          BUILD_ANDROID: ${{ needs.build-android.result }}
          BUILD_IOS: ${{ needs.build-ios.result }}
          NATIVE_ANDROID: ${{ needs.native-android.result }}
          NATIVE_IOS: ${{ needs.native-ios.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -eu
          if [[ "$CONFIG_RESULT" != "success" ]]; then
            echo "Native configuration failed: $CONFIG_RESULT" >&2
            exit 1
          fi
          if [[ "$DRAFT" == "true" ]]; then
            message='Draft PR: native jobs skipped; they run when marked ready for review'
            echo "$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$RUN_NATIVE" != "true" ]]; then
            if [[ "$RUN_NATIVE" != "false" ]]; then
              echo "Native configuration produced no execution decision." >&2
              exit 1
            fi
            echo "No native-impacting paths changed; platform jobs correctly skipped."
            exit 0
          fi

          failed=0
          if [[ "$REQUESTED_PLATFORM" != "ios" ]]; then
            if [[ "$BUILD_ANDROID" != "success" || "$NATIVE_ANDROID" != "success" ]]; then
              echo "Android native validation is incomplete: build=$BUILD_ANDROID journey=$NATIVE_ANDROID" >&2
              failed=1
            fi
          fi

          if [[ "$REQUESTED_PLATFORM" != "android" ]]; then
            if [[ "$IOS_ENABLED" != "true" ]]; then
              echo "iOS native validation is disabled for a native-impacting change." >&2
              failed=1
            elif [[ "$BUILD_IOS" != "success" || "$NATIVE_IOS" != "success" ]]; then
              echo "iOS native validation is incomplete: build=$BUILD_IOS journey=$NATIVE_IOS" >&2
              failed=1
            fi
          fi

          exit "$failed"
      - name: Delete simulator app artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          NATIVE_ANDROID: ${{ needs.native-android.result }}
          NATIVE_IOS: ${{ needs.native-ios.result }}
        run: |
          set -eu
          keep=0
          for result in "$NATIVE_ANDROID" "$NATIVE_IOS"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              keep=1
            fi
          done
          if [[ "$keep" -eq 1 ]]; then
            echo "Keeping simulator app artifacts because a journey job did not succeed (android=$NATIVE_ANDROID ios=$NATIVE_IOS). They expire in 1 day so Re-run failed jobs can download them."
            exit 0
          fi
          if ! ids="$(gh api "repos/${GH_REPO}/actions/runs/${GH_RUN_ID}/artifacts" --paginate --jq '.artifacts[] | select(.name == "android-simulator-app" or .name == "ios-simulator-app") | .id')"; then
            echo "Warning: could not list simulator app artifacts for run ${GH_RUN_ID}." >&2
            exit 0
          fi
          if [[ -z "$ids" ]]; then
            echo "No simulator app artifacts to delete."
            exit 0
          fi
          while IFS= read -r id; do
            [[ -z "$id" ]] && continue
            if gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${id}"; then
              echo "Deleted simulator app artifact ${id}."
            else
              echo "Warning: failed to delete simulator app artifact ${id}." >&2
            fi
          done <<< "$ids"
