name: native-ci

# Path-filtered PRs, post-merge, daily schedule, and on demand.
# Native binaries are built in dedicated jobs and handed to Maestro jobs as
# artifacts (build once → test). Warm Android boots use a cached AVD snapshot;
# iOS uses mtime/inode-aware DerivedData + Pods caches when the .app misses.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 14 * * *'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/.maestro/**'
      - 'mobile/app/**'
      - 'mobile/src/components/**'
      - 'mobile/app.json'
      - 'mobile/metro.config.js'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'api/**'
      - '.github/workflows/native-ci.yml'
      - '.github/scripts/run-android-native-journey.sh'
      - '.github/scripts/build-ios-simulator-app.sh'
      - '.github/scripts/install-maestro.sh'
      - '.github/ci.env'
  push:
    branches: [main]
    paths:
      - 'mobile/.maestro/**'
      - 'mobile/app/**'
      - 'mobile/src/components/**'
      - 'mobile/app.json'
      - 'mobile/metro.config.js'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
      - 'api/**'
      - '.github/workflows/native-ci.yml'
      - '.github/scripts/run-android-native-journey.sh'
      - '.github/scripts/build-ios-simulator-app.sh'
      - '.github/scripts/install-maestro.sh'
      - '.github/ci.env'

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.versions.outputs.node_version }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      android_api_level: ${{ steps.versions.outputs.android_api_level }}
      ios_runner: ${{ steps.versions.outputs.ios_runner }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          set -eu
          source .github/ci.env
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"
          echo "android_api_level=$ANDROID_API_LEVEL" >> "$GITHUB_OUTPUT"
          echo "ios_runner=$IOS_RUNNER" >> "$GITHUB_OUTPUT"

  build-android:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v5
      - name: Restore Android simulator app
        id: android-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          key: android-simulator-app-v1-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**') }}
      - name: Build Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix mobile
          cd mobile
          CI=1 npx expo prebuild --platform android --no-install
          cd android
          ./gradlew app:assembleDebug
          mkdir -p ../.ci/android
          cp app/build/outputs/apk/debug/app-debug.apk ../.ci/android/stead-debug.apk
      - name: Save Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          key: ${{ steps.android-app-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android/stead-debug.apk
          if-no-files-found: error
          retention-days: 1

  build-ios:
    needs: config
    runs-on: ${{ needs.config.outputs.ios_runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Restore iOS simulator app
        id: ios-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ci/ios/mobile.app
          key: ios-simulator-app-${{ needs.config.outputs.ios_runner }}-v1-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**') }}
      - name: Restore source mtimes for incremental Xcode
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: chetan/git-restore-mtime-action@v2
      - name: Install mobile dependencies
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix mobile
      - name: Prebuild iOS project
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: CI=1 npx expo prebuild --platform ios --no-install
      - name: Cache CocoaPods
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ needs.config.outputs.ios_runner }}-${{ hashFiles('mobile/ios/Podfile.lock', 'mobile/package-lock.json') }}
          restore-keys: |
            ios-pods-${{ needs.config.outputs.ios_runner }}-
      - name: Resolve Xcode version
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Set DerivedData path
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: derived
        run: echo "path=${RUNNER_TEMP}/DerivedData" >> "$GITHUB_OUTPUT"
      - name: Cache Xcode DerivedData (mtime + inode aware)
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: irgaly/xcode-cache@v1
        with:
          key: ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-
          deriveddata-directory: ${{ steps.derived.outputs.path }}
      - name: Build iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        env:
          DERIVED_DATA_PATH: ${{ steps.derived.outputs.path }}
        run: bash .github/scripts/build-ios-simulator-app.sh
      - name: Save iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ci/ios/mobile.app
          key: ${{ steps.ios-app-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/.ci/ios/mobile.app
          if-no-files-found: error
          retention-days: 1

  native-android:
    needs: [config, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stead
          POSTGRES_PASSWORD: stead
          POSTGRES_DB: stead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stead -d stead"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json
      - name: Download Android simulator app
        uses: actions/download-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android
      - name: Restore Android Metro transforms
        uses: actions/cache@v4
        with:
          path: mobile/.cache/metro
          key: metro-android-v1-${{ hashFiles('mobile/package-lock.json', 'mobile/metro.config.js', 'mobile/babel.config.js') }}
      - name: Cache Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-ubuntu-v1
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install dependencies and prepare API
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix api
          npm ci --prefix mobile
          cd api
          npx prisma migrate deploy
          npm run build
      - name: Start API and Metro
        run: |
          NODE_ENV=test node api/dist/src/main.js > "$RUNNER_TEMP/stead-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/auth/countries > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/auth/countries > /dev/null
          (cd mobile && NODE_OPTIONS=--dns-result-order=ipv4first npx expo start --localhost) > "$RUNNER_TEMP/stead-metro.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'
          nohup curl --fail --silent --show-error --retry 3 \
            'http://127.0.0.1:8081/node_modules/expo-router/entry.bundle?platform=android&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&unstable_transformProfile=hermes-stable' \
            --output "$RUNNER_TEMP/stead-android.bundle" \
            > "$RUNNER_TEMP/stead-metro-prewarm.log" 2>&1 &
      - name: Install Maestro
        run: bash .github/scripts/install-maestro.sh
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ needs.config.outputs.android_api_level }}-x86_64-v1
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.config.outputs.android_api_level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run Android native journey
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.config.outputs.android_api_level }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: mobile
          script: bash ../.github/scripts/run-android-native-journey.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-native-journey-logs
          path: |
            ${{ runner.temp }}/stead-api.log
            ${{ runner.temp }}/stead-metro.log
            ${{ runner.temp }}/stead-metro-prewarm.log
            ~/.maestro/tests
            mobile/.expo
          retention-days: 7

  native-ios:
    needs: [config, build-ios]
    runs-on: ${{ needs.config.outputs.ios_runner }}
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json
      - name: Download iOS simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/.ci/ios
      - name: Restore iOS Metro transforms
        uses: actions/cache@v4
        with:
          path: mobile/.cache/metro
          key: metro-ios-v1-${{ hashFiles('mobile/package-lock.json', 'mobile/metro.config.js', 'mobile/babel.config.js') }}
      - name: Cache Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-macos-v1
      - name: Start PostgreSQL 16
        uses: ikalnytskyi/action-setup-postgres@v8
        with:
          username: stead
          password: stead
          database: stead
          postgres-version: '16'
      - name: Install dependencies and prepare API
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci --prefix api
          npm ci --prefix mobile
          cd api
          npx prisma migrate deploy
          npm run build
      - name: Start API and Metro
        run: |
          NODE_ENV=test node api/dist/src/main.js > "$RUNNER_TEMP/stead-api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/auth/countries > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3000/auth/countries > /dev/null
          (cd mobile && NODE_OPTIONS=--dns-result-order=ipv4first npx expo start --localhost) > "$RUNNER_TEMP/stead-metro.log" 2>&1 &
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:8081/status | grep -q 'packager-status:running'; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8081/status | grep -q 'packager-status:running'
          nohup curl --fail --silent --show-error --retry 3 \
            'http://127.0.0.1:8081/node_modules/expo-router/entry.bundle?platform=ios&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.bytecode=1&unstable_transformProfile=hermes-stable' \
            --output "$RUNNER_TEMP/stead-ios.bundle" \
            > "$RUNNER_TEMP/stead-metro-prewarm.log" 2>&1 &
      - name: Install Maestro
        run: bash .github/scripts/install-maestro.sh
      - name: Install app on simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | jq -r '[.devices[] | .[] | select(.name == "iPhone 17")] | last | .udid')"
          test -n "$DEVICE_ID" && test "$DEVICE_ID" != null
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          APP_PATH=mobile/.ci/ios/mobile.app
          if [[ ! -d "$APP_PATH" && -d mobile/.ci/ios/mobile.app/mobile.app ]]; then
            APP_PATH=mobile/.ci/ios/mobile.app/mobile.app
          fi
          test -d "$APP_PATH"
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"
          for attempt in $(seq 1 180); do
            if test -s "$RUNNER_TEMP/stead-ios.bundle"; then break; fi
            sleep 1
          done
          test -s "$RUNNER_TEMP/stead-ios.bundle" || cat "$RUNNER_TEMP/stead-metro-prewarm.log"
          test -s "$RUNNER_TEMP/stead-ios.bundle"
      - name: Run iOS native journey
        working-directory: mobile
        run: maestro test -e TEST_PHONE=08030000001 .maestro/critical-native-journey.yaml
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-native-journey-logs
          path: |
            ${{ runner.temp }}/stead-api.log
            ${{ runner.temp }}/stead-metro.log
            ${{ runner.temp }}/stead-metro-prewarm.log
            ~/.maestro/tests
            mobile/.expo
          retention-days: 7
