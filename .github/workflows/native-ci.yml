name: native-ci

# Every PR and main-branch push produces a stable native-ci readiness signal.
# The config job skips expensive native jobs when they are irrelevant.
# Scheduled runs execute the full suite; manual runs can select a platform. Native binaries are
# built in dedicated jobs and handed to Maestro jobs as artifacts (build once
# → test). Android boots a dedicated AVD from checksum-locked SDK archives;
# iOS uses mtime/inode-aware DerivedData + Pods caches when the .app misses.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platforms to validate
        type: choice
        options: [all, ios, android]
        default: all
  # After Dependabot + Dependency Maintenance (13:00 UTC) and Dependency
  # Audit (13:30 UTC), leave room for PR CI and auto-merge onto main before
  # the daily native smoke. Main pushes also produce the readiness signal.
  schedule:
    - cron: '0 16 * * *'
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      run_native: ${{ steps.decision.outputs.run_native }}
      node_version: ${{ steps.versions.outputs.node_version }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      android_api_level: ${{ steps.versions.outputs.android_api_level }}
      ios_runner: ${{ steps.versions.outputs.ios_runner }}
      maestro_version: ${{ steps.versions.outputs.maestro_version }}
      maestro_sha256: ${{ steps.versions.outputs.maestro_sha256 }}
      java_version: ${{ steps.versions.outputs.java_version }}
      ruby_version: ${{ steps.versions.outputs.ruby_version }}
      bundler_version: ${{ steps.versions.outputs.bundler_version }}
      postgres_version: ${{ steps.versions.outputs.postgres_version }}
      postgres_image: ${{ steps.versions.outputs.postgres_image }}
      emulator_build: ${{ steps.versions.outputs.emulator_build }}
      image_target: ${{ steps.versions.outputs.image_target }}
      android_arch: ${{ steps.versions.outputs.android_arch }}
      android_profile: ${{ steps.versions.outputs.android_profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect native-impacting changes
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: some-with-excludes
          filters: .github/native-ci-paths.yml
      - name: Resolve native execution decision
        id: decision
        env:
          CHANGED: ${{ steps.changes.outputs.native }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            echo "run_native=$CHANGED" >> "$GITHUB_OUTPUT"
          else
            echo "run_native=true" >> "$GITHUB_OUTPUT"
          fi
      - id: versions
        run: |
          set -eu
          source .github/ci.env
          {
            echo "node_version=$NODE_VERSION"
            echo "npm_version=$NPM_VERSION"
            echo "android_api_level=$ANDROID_API_LEVEL"
            echo "ios_runner=$IOS_RUNNER"
            echo "maestro_version=$MAESTRO_VERSION"
            echo "maestro_sha256=$MAESTRO_SHA256"
            echo "java_version=$JAVA_VERSION"
            echo "ruby_version=$RUBY_VERSION"
            echo "bundler_version=$BUNDLER_VERSION"
            echo "postgres_version=$POSTGRES_VERSION"
            echo "postgres_image=$POSTGRES_IMAGE"
            echo "emulator_build=$ANDROID_EMULATOR_BUILD"
            echo "image_target=$ANDROID_IMAGE_TARGET"
            echo "android_arch=$ANDROID_ARCH"
            echo "android_profile=$ANDROID_PROFILE"
          } >> "$GITHUB_OUTPUT"

  build-android:
    needs: config
    if: needs.config.outputs.run_native == 'true' && inputs.platform != 'ios'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java_version }}
      - name: Cache Gradle dependencies and build outputs
        uses: gradle/actions/setup-gradle@v5
      - name: Restore Android simulator app
        id: android-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          # The shared build recipe, dependency lockfiles, and toolchain
          # pins are part of the key: a build-only change
          # must not reuse an APK produced by the old recipe.
          key: android-simulator-app-v3-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**', 'mobile/app/**', 'mobile/src/**', '.github/ci.env', '.github/workflows/native-ci.yml', 'scripts/native-*.mjs', 'scripts/android-*.mjs', 'scripts/archive-utils.mjs', '.github/android-sdk-lock.json', 'scripts/ios-setup.mjs', 'scripts/process-utils.mjs', 'scripts/local-workflow.mjs', 'scripts/ios-simulator-entitlements.mjs', 'scripts/toolchain.mjs', 'mobile/Gemfile', 'mobile/Gemfile.lock') }}
      - name: Install Android build dependencies
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
          npm ci --prefix mobile
      - name: Cache locked Android SDK
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .tmp/android-sdk
          key: android-sdk-${{ runner.os }}-${{ hashFiles('.github/android-sdk-lock.json') }}
      - name: Install locked Android SDK
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: npm run tools:install:android -- --accept-licenses
      - name: Build Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        run: npm run native:build:android
      - name: Save Android simulator app
        if: steps.android-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ci/android/stead-debug.apk
          key: ${{ steps.android-app-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android/stead-debug.apk
          if-no-files-found: error
          retention-days: 1

  build-ios:
    needs: config
    if: needs.config.outputs.run_native == 'true' && inputs.platform != 'android'
    runs-on: ${{ needs.config.outputs.ios_runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install shared runner dependencies
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
      - name: Select pinned Xcode and simulator
        run: npm run native:setup:ios
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.config.outputs.ruby_version }}
          bundler: ${{ needs.config.outputs.bundler_version }}
          bundler-cache: true
          working-directory: mobile
      # Resolved before the app-cache restore so the cached .app is keyed on
      # the Xcode that built it (runner images can change Xcode in place).
      - name: Resolve Xcode version
        id: xcode
        run: echo "version=$(xcodebuild -version | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
      - name: Restore iOS simulator app
        id: ios-app-cache
        uses: actions/cache/restore@v4
        with:
          path: mobile/.ci/ios/mobile.app
          # Include the build script, toolchain pins, and this workflow so a
          # build-only change must rebuild instead of reusing a stale .app.
          key: ios-simulator-app-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-v3-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/assets/**', 'mobile/app/**', 'mobile/src/**', '.github/scripts/build-ios-simulator-app.sh', '.github/ci.env', '.github/workflows/native-ci.yml', 'scripts/native-*.mjs', 'scripts/android-*.mjs', 'scripts/archive-utils.mjs', '.github/android-sdk-lock.json', 'scripts/ios-setup.mjs', 'scripts/process-utils.mjs', 'scripts/local-workflow.mjs', 'scripts/ios-simulator-entitlements.mjs', 'scripts/toolchain.mjs', 'mobile/Gemfile', 'mobile/Gemfile.lock') }}
      - name: Restore source mtimes for incremental Xcode
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: chetan/git-restore-mtime-action@v2
      - name: Install mobile dependencies
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
          npm ci --prefix mobile
      - name: Prebuild iOS project
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        working-directory: mobile
        run: CI=1 EXPO_NO_DOTENV=1 npx expo prebuild --platform ios --no-install
      - name: Cache CocoaPods
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: pods-cache
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ios-pods-${{ needs.config.outputs.ios_runner }}-${{ hashFiles('mobile/ios/Podfile.lock', 'mobile/package-lock.json', 'mobile/Gemfile.lock') }}
          restore-keys: |
            ios-pods-${{ needs.config.outputs.ios_runner }}-
      - name: Set DerivedData path
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        id: derived
        run: echo "path=${RUNNER_TEMP}/DerivedData" >> "$GITHUB_OUTPUT"
      - name: Cache Xcode DerivedData (mtime + inode aware)
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: irgaly/xcode-cache@v1
        with:
          key: ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-${{ github.sha }}
          restore-keys: |
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-${{ hashFiles('package.json', 'package-lock.json', 'mobile/package-lock.json', 'mobile/app.json', 'mobile/ios/Podfile.lock') }}-
            ios-dd-${{ needs.config.outputs.ios_runner }}-${{ steps.xcode.outputs.version }}-
          deriveddata-directory: ${{ steps.derived.outputs.path }}
      - name: Build iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        env:
          DERIVED_DATA_PATH: ${{ steps.derived.outputs.path }}
        run: npm run native:build:ios -- --project-ready
      - name: Save iOS simulator app
        if: steps.ios-app-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: mobile/.ci/ios/mobile.app
          key: ${{ steps.ios-app-cache.outputs.cache-primary-key }}
      - name: Package iOS app zip for artifact transfer
        run: |
          set -eu
          test -d mobile/.ci/ios/mobile.app
          test -f mobile/.ci/ios/mobile.app/Info.plist
          rm -f mobile/.ci/ios/mobile.app.zip
          # Zip preserves .app layout across Actions artifact upload/download.
          ditto -c -k --sequesterRsrc --keepParent \
            mobile/.ci/ios/mobile.app \
            mobile/.ci/ios/mobile.app.zip
          ls -lh mobile/.ci/ios/mobile.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/.ci/ios/mobile.app.zip
          if-no-files-found: error
          retention-days: 1

  native-android:
    needs: [config, build-android]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ needs.config.outputs.postgres_image }}
        env:
          POSTGRES_USER: stead
          POSTGRES_PASSWORD: stead
          POSTGRES_DB: stead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stead -d stead"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_E2E_PHONE: '08030000001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json
      - name: Download Android simulator app
        uses: actions/download-artifact@v4
        with:
          name: android-simulator-app
          path: mobile/.ci/android
      - name: Install shared runner command
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
      - name: Run Android native journey
        run: npm run test:native:android:container -- --database-ready --app mobile/.ci/android/stead-debug.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-native-journey-logs
          include-hidden-files: true
          path: |
            .tmp/native-container/**/attempt-*/**
            .tmp/native-container/**/build.log
            .tmp/native-container/**/source.json
          retention-days: 7

  native-ios:
    needs: [config, build-ios]
    runs-on: ${{ needs.config.outputs.ios_runner }}
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://stead:stead@127.0.0.1:5432/stead?schema=e2e_native
      JWT_SECRET: stead-native-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-native-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-native-ci-device-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      EXPO_PUBLIC_API_URL: http://127.0.0.1:3000
      EXPO_PUBLIC_E2E_PHONE: '08030000001'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ needs.config.outputs.java_version }}
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ needs.config.outputs.ruby_version }}
          bundler: ${{ needs.config.outputs.bundler_version }}
          bundler-cache: true
          working-directory: mobile
      - name: Install shared runner dependencies
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
      - name: Download iOS simulator app
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: mobile/.ci/ios
      - name: Unpack iOS simulator app
        run: |
          set -eu
          cd mobile/.ci/ios
          test -f mobile.app.zip
          rm -rf mobile.app
          ditto -x -k mobile.app.zip .
          APP_PATH="$(find "$PWD" -path '*/mobile.app/Info.plist' -print -quit | sed 's#/Info.plist$##')"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          # Normalize to a stable path for later steps.
          if [[ "$APP_PATH" != "$PWD/mobile.app" ]]; then
            rm -rf "$PWD/mobile.app"
            ditto "$APP_PATH" "$PWD/mobile.app"
          fi
          test -f "$PWD/mobile.app/Info.plist"
          echo "Unpacked $PWD/mobile.app"
      - name: Restore iOS Metro transforms
        uses: actions/cache@v4
        with:
          path: mobile/.cache/metro
          key: metro-ios-v1-${{ hashFiles('mobile/package-lock.json', 'mobile/metro.config.js', 'mobile/babel.config.js') }}
      - name: Cache Maestro CLI
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: maestro-macos-${{ needs.config.outputs.maestro_version }}-${{ needs.config.outputs.maestro_sha256 }}-v3
      - name: Cache pinned PostgreSQL binaries
        uses: actions/cache@v4
        with:
          path: .tmp/tools/postgres
          key: postgres-source-${{ runner.os }}-${{ runner.arch }}-${{ needs.config.outputs.postgres_version }}-${{ hashFiles('.github/ci.env', '.github/scripts/install-native-postgres.sh') }}
      - name: Install pinned PostgreSQL
        run: bash .github/scripts/install-native-postgres.sh
      - name: Start isolated PostgreSQL
        env:
          PGPASSWORD: stead
        run: |
          node --input-type=module -e "import { assertPortAvailable } from './scripts/process-utils.mjs'; await assertPortAvailable(5432)"
          PG_TEST_DATA="$RUNNER_TEMP/stead-native-postgres"
          PG_TEST_PASSWORD="$RUNNER_TEMP/stead-native-postgres-password"
          printf '%s\n' 'stead' > "$PG_TEST_PASSWORD"
          chmod 600 "$PG_TEST_PASSWORD"
          initdb --pgdata="$PG_TEST_DATA" --username=stead --pwfile="$PG_TEST_PASSWORD" --auth=scram-sha-256 --encoding=UTF8 --locale=en_US.UTF-8
          pg_ctl -D "$PG_TEST_DATA" -l "$RUNNER_TEMP/stead-native-postgres.log" -o '-h 127.0.0.1 -p 5432' -w start
          createdb -h 127.0.0.1 -U stead stead
      - name: Install dependencies and prepare API
        run: |
          npm install --global npm@${{ needs.config.outputs.npm_version }}
          npm ci
          npm ci --prefix api
          npm ci --prefix mobile
      - name: Install Maestro
        run: bash .github/scripts/install-maestro.sh
      - name: Run iOS native journey
        run: |
          npm run native:setup:ios
          node scripts/native-workflow.mjs test --platform ios --database-ready --repeat 3 --app mobile/.ci/ios/mobile.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-journey-logs
          include-hidden-files: true
          path: |
            .tmp/native-validation
            ~/.maestro/tests
            mobile/.expo
            mobile/.ci/ios
          retention-days: 7
