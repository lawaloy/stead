name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-24.04
    outputs:
      node_version: ${{ steps.versions.outputs.node_version }}
      npm_version: ${{ steps.versions.outputs.npm_version }}
      postgres_version: ${{ steps.versions.outputs.postgres_version }}
      postgres_image: ${{ steps.versions.outputs.postgres_image }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: |
          set -eu
          source .github/ci.env
          {
            echo "node_version=$NODE_VERSION"
            echo "npm_version=$NPM_VERSION"
            echo "postgres_version=$POSTGRES_VERSION"
            echo "postgres_image=$POSTGRES_IMAGE"
          } >> "$GITHUB_OUTPUT"

  format:
    needs: config
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm version
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install formatting dependencies
        run: npm ci

      - name: Check repository formatting
        run: npm run format:check

      - name: Validate workflow contracts
        run: npm run workflows:check

  lint:
    needs: config
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check API/mobile contract generation
        run: npm run contracts:check

      - name: Lint
        run: npm run lint -- --no-fix

      - name: Setup Node for mobile lint
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm version for mobile lint
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Lint mobile
        working-directory: mobile
        run: npm run lint

  test:
    name: api-test
    needs: config
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: ${{ needs.config.outputs.postgres_image }}
        env:
          POSTGRES_USER: stead
          POSTGRES_PASSWORD: stead
          POSTGRES_DB: stead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stead -d stead"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=e2e
      NODE_ENV: test
      JWT_SECRET: stead-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-ci-device-identifier-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Unit tests
        run: npm run test -- --ci --runInBand

      - name: Install shared runner dependencies
        working-directory: .
        run: npm ci

      - name: Database-backed API end-to-end tests
        working-directory: .
        run: node scripts/local-workflow.mjs test:e2e --database-ready

  mobile-api-journey:
    needs: config
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: ${{ needs.config.outputs.postgres_image }}
        env:
          POSTGRES_USER: stead
          POSTGRES_PASSWORD: stead
          POSTGRES_DB: stead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stead -d stead"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=e2e_mobile
      NODE_ENV: test
      JWT_SECRET: stead-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-ci-device-identifier-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
      STEAD_TEST_API_URL: http://127.0.0.1:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install API and mobile dependencies
        run: |
          npm ci
          npm --prefix api ci
          npm --prefix mobile ci

      # Includes real Detox/Jest discovery, so run after mobile dev dependencies
      # are installed rather than in the root-only formatting job.
      - name: Test developer automation
        run: npm run automation:test

      - name: Exercise live mobile API client journey
        run: node scripts/local-workflow.mjs test:journey --database-ready

  build:
    runs-on: ubuntu-24.04
    needs: config
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Setup Node for mobile build
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm version for mobile build
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build mobile
        working-directory: mobile
        run: npm run build

  mobile-test:
    needs: config
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.config.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@${{ needs.config.outputs.npm_version }}

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand
