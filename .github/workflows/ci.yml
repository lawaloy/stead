name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check API/mobile contract generation
        run: npm run contracts:check

      - name: Lint
        run: npm run lint -- --no-fix

      - name: Setup Node for mobile lint
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm version for mobile lint
        run: npm install --global npm@10.9.7

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Lint mobile
        working-directory: mobile
        run: npm run lint

  test:
    name: api-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stead
          POSTGRES_PASSWORD: stead
          POSTGRES_DB: stead
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stead -d stead"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=e2e
      NODE_ENV: test
      JWT_SECRET: stead-ci-jwt-secret
      NOTIFICATION_PAYLOAD_ENCRYPTION_KEY: stead-ci-notification-key-1234567890
      AUTH_DEVICE_IDENTIFIER_SECRET: stead-ci-device-identifier-key-1234567890
      SMS_PROVIDER: dev
      DEV_EXPOSE_OTP: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Unit tests
        run: npm run test -- --ci --runInBand

      - name: End-to-end tests
        run: npm run test:e2e -- --ci --runInBand

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Setup Node for mobile build
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm version for mobile build
        run: npm install --global npm@10.9.7

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Build mobile
        working-directory: mobile
        run: npm run build
