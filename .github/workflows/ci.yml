name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'mobile/**'
              - '.github/workflows/ci.yml'

  lint:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when API is unchanged
        if: needs.changes.outputs.api != 'true' && needs.changes.outputs.mobile != 'true'
        run: echo "No API or mobile changes detected; skipping lint."

      - name: Setup Node
        if: needs.changes.outputs.api == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.api == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: needs.changes.outputs.api == 'true'
        run: npx prisma generate

      - name: Lint
        if: needs.changes.outputs.api == 'true'
        run: npm run lint -- --no-fix

      - name: Setup Node for mobile lint
        if: needs.changes.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        if: needs.changes.outputs.mobile == 'true'
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Lint mobile
        if: needs.changes.outputs.mobile == 'true'
        working-directory: mobile
        run: npm run lint

  test:
    name: api-test
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when API is unchanged
        if: needs.changes.outputs.api != 'true'
        run: echo "No API changes detected; skipping tests."

      - name: Setup Node
        if: needs.changes.outputs.api == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.api == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: needs.changes.outputs.api == 'true'
        run: npx prisma generate

      - name: Unit tests
        if: needs.changes.outputs.api == 'true'
        run: npm run test -- --ci --runInBand

  build:
    runs-on: ubuntu-latest
    needs: [changes, lint, test]
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgresql://stead:stead@localhost:5432/stead?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip when API is unchanged
        if: needs.changes.outputs.api != 'true' && needs.changes.outputs.mobile != 'true'
        run: echo "No API or mobile changes detected; skipping build."

      - name: Setup Node
        if: needs.changes.outputs.api == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.api == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: needs.changes.outputs.api == 'true'
        run: npx prisma generate

      - name: Build
        if: needs.changes.outputs.api == 'true'
        run: npm run build

      - name: Setup Node for mobile build
        if: needs.changes.outputs.mobile == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        if: needs.changes.outputs.mobile == 'true'
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Build mobile
        if: needs.changes.outputs.mobile == 'true'
        working-directory: mobile
        run: npm run build
