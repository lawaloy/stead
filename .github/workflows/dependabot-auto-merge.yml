name: Dependabot Auto Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Check manual block label
        id: policy
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const labels = context.payload.pull_request.labels.map((label) => label.name);
            const blocked = labels.includes('automerge-blocked');

            core.setOutput('allowed', String(!blocked));
            core.setOutput('blocked', String(blocked));

            if (blocked) {
              core.info('Auto-merge disabled by automerge-blocked label.');
            }

      - name: Auto-approve safe updates
        if: |
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          steps.policy.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            try {
              await github.rest.pulls.createReview({
                owner,
                repo,
                pull_number,
                event: 'APPROVE',
                body: 'Auto-approving safe Dependabot update.'
              });
            } catch (error) {
              if (!String(error.message).includes('Can not approve your own pull request')) {
                throw error;
              }
            }

      - name: Enable auto-merge for safe updates
        if: |
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          steps.policy.outputs.allowed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const pullRequestNodeId = context.payload.pull_request.node_id;
            const mutation = `
              mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest {
                    number
                    autoMergeRequest {
                      enabledAt
                    }
                  }
                }
              }
            `;

            const maxAttempts = 20;
            const delayMs = 30000;

            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                await github.graphql(mutation, {
                  pullRequestId: pullRequestNodeId,
                });
                core.info(`Auto-merge enabled on attempt ${attempt}.`);
                return;
              } catch (error) {
                const message = String(error.message || error);
                const retryable =
                  message.includes('Pull request is in unstable status') ||
                  message.includes('Base branch was modified') ||
                  message.includes('Head branch was modified');

                if (!retryable || attempt === maxAttempts) {
                  throw error;
                }

                core.info(
                  `Auto-merge not ready yet (attempt ${attempt}/${maxAttempts}): ${message}`,
                );
                await new Promise((resolve) => setTimeout(resolve, delayMs));
              }
            }

      - name: Comment when auto-merge is skipped
        if: |
          (
            steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
            steps.metadata.outputs.update-type == 'version-update:semver-minor'
          ) &&
          steps.policy.outputs.allowed != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: 'Auto-merge skipped because the `automerge-blocked` label is present.'
            });
