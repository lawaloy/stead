name: Dependency Auto Finish

on:
  workflow_run:
    # native-ci is the stable aggregate and the longest dependency-PR gate.
    # The reusable finisher waits for every other required workflow.
    workflows: ['native-ci']
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Dependency pull request to re-evaluate after a recovered check
        required: true
        type: number

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dependency-auto-finish-${{ inputs.pull_number || github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  finish:
    name: Dependency PR Readiness
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success')
    uses: ./.github/workflows/pr-auto-finish-reusable.yml
    with:
      lane: auto
      pull_number: ${{ inputs.pull_number || 0 }}
    secrets: inherit
