name: Dependency Auto Finish

on:
  workflow_run:
    # native-ci is the stable aggregate and the longest dependency-PR gate.
    # The reusable finisher waits for every other required workflow.
    workflows: ['native-ci']
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: dependency-auto-finish-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  finish:
    name: Dependency PR Readiness
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/pr-auto-finish-reusable.yml
    with:
      lane: auto
    secrets: inherit
