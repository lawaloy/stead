name: PR Description

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR description
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_REF

          # Get changed files (bullet list)
          FILE_LIST=$(git diff --name-only origin/$BASE_REF...HEAD)
          FILES=$(echo "$FILE_LIST" | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/')
          [ -z "$FILES" ] && FILES="- (no files changed)"

          # Generate human-readable summary from changed areas (not commit titles)
          SUMMARY=""
          if echo "$FILE_LIST" | grep -Eq '^api/'; then
            SUMMARY="${SUMMARY}- Backend API updated (code/config/tests).\n"
          fi
          if echo "$FILE_LIST" | grep -Eq '^mobile/'; then
            SUMMARY="${SUMMARY}- Mobile app updated (screens/state/tests).\n"
          fi
          if echo "$FILE_LIST" | grep -Eq '^\\.github/workflows/'; then
            SUMMARY="${SUMMARY}- CI/workflows updated.\n"
          fi
          if echo "$FILE_LIST" | grep -Eq '^\\.github/labeler\\.yml'; then
            SUMMARY="${SUMMARY}- PR labeling rules updated.\n"
          fi
          if echo "$FILE_LIST" | grep -Eq '^docs/|^README\\.md$'; then
            SUMMARY="${SUMMARY}- Documentation and project structure notes updated.\n"
          fi
          if [ -z "$SUMMARY" ]; then
            SUMMARY="- Maintenance update across repository files."
          fi

          {
            echo "## Summary"
            echo ""
            echo -e "$SUMMARY"
            echo ""
            echo "## Files changed"
            echo ""
            echo "$FILES"
          } > pr-body.md

      - name: Update PR description
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MAX_LENGTH = 1000;
            const TRUNCATE_SUFFIX = '\n\n...';

            let body = fs.readFileSync('pr-body.md', 'utf8');

            if (body.length > MAX_LENGTH) {
              // Keep whole lines; never cut file paths mid-line.
              const lines = body.split('\n');
              let out = '';
              for (const line of lines) {
                const candidate = out ? `${out}\n${line}` : line;
                if (candidate.length + TRUNCATE_SUFFIX.length > MAX_LENGTH) break;
                out = candidate;
              }
              body = out + TRUNCATE_SUFFIX;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              body
            });
