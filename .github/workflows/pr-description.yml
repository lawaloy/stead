name: PR Description

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  update-description:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate PR description
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_REF

          # Get commit messages (summary)
          COMMITS=$(git log --format="- %s" origin/$BASE_REF..HEAD)
          [ -z "$COMMITS" ] && COMMITS="- (no new commits)"

          # Get changed files (plain lines for readability)
          FILES=$(git diff --name-only origin/$BASE_REF...HEAD)
          [ -z "$FILES" ] && FILES="(no files changed)"

          {
            echo "## Summary"
            echo ""
            echo "$COMMITS"
            echo ""
            echo "## Files changed"
            echo ""
            echo '```txt'
            echo "$FILES"
            echo '```'
          } > pr-body.md

      - name: Update PR description
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MAX_LENGTH = 1000;
            const TRUNCATE_SUFFIX = '\n\n...';

            let body = fs.readFileSync('pr-body.md', 'utf8');

            if (body.length > MAX_LENGTH) {
              // Keep whole lines; never cut file paths mid-line.
              const lines = body.split('\n');
              let out = '';
              for (const line of lines) {
                const candidate = out ? `${out}\n${line}` : line;
                if (candidate.length + TRUNCATE_SUFFIX.length > MAX_LENGTH) break;
                out = candidate;
              }
              body = out + TRUNCATE_SUFFIX;
            }

            const { owner, repo } = context.repo;
            const prNumber = context.payload.pull_request.number;
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: prNumber,
              body
            });
