name: Dependency Maintenance Auto Finish

on:
  workflow_run:
    workflows: ["ci", "mobile-ci", "CodeQL Advanced", "Dependency review"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finish:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/pr-auto-finish-reusable.yml
    with:
      lane: maintenance
    secrets: inherit
