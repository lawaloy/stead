name: Dependency Maintenance Auto Finish

on:
  workflow_run:
    workflows: ["ci", "mobile-ci", "CodeQL Advanced", "Dependency review"]
    types: [completed]

jobs:
  finish:
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0]
    uses: ./.github/workflows/pr-auto-finish-reusable.yml
    with:
      lane: maintenance
      pull_number: ${{ github.event.workflow_run.pull_requests[0].number }}
    secrets: inherit
