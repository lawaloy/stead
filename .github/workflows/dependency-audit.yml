name: Dependency Audit

on:
  pull_request:
    paths:
      - 'api/package.json'
      - 'api/package-lock.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
  push:
    branches:
      - main
    paths:
      - 'api/package.json'
      - 'api/package-lock.json'
      - 'mobile/package.json'
      - 'mobile/package-lock.json'
  schedule:
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared tool versions
        id: versions
        shell: bash
        run: |
          set -eu
          source "$GITHUB_WORKSPACE/.github/ci.env"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Pin npm version
        run: npm install --global "npm@${{ steps.versions.outputs.npm_version }}"

      - name: Verify lockfile installation
        run: npm ci --ignore-scripts

      - name: Fail on high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Report moderate-or-higher full-tree vulnerabilities
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=moderate

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load shared tool versions
        id: versions
        shell: bash
        run: |
          set -eu
          source "$GITHUB_WORKSPACE/.github/ci.env"
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"
          echo "npm_version=$NPM_VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node_version }}
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Pin npm version
        run: npm install --global "npm@${{ steps.versions.outputs.npm_version }}"

      - name: Verify lockfile installation
        run: npm ci --ignore-scripts

      - name: Fail on high-severity production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Report moderate-or-higher full-tree vulnerabilities
        if: always()
        continue-on-error: true
        run: npm audit --audit-level=moderate
