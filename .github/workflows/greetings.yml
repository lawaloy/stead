name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: "Thanks for opening your first issue in Stead. We appreciate you taking the time to report it and will review it as soon as we can."
        pr-message: "Thanks for opening your first pull request in Stead. We appreciate the contribution and will review it as soon as we can."
