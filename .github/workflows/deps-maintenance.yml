name: Dependency Maintenance

on:
  schedule:
    - cron: '0 10 * * 1'
    - cron: '0 10 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Update API lockfile and patch vulnerabilities
        working-directory: api
        run: |
          npm update
          npm audit fix || true

      - name: API audit report (non-blocking)
        working-directory: api
        run: npm audit --audit-level=moderate || true

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Update mobile lockfile and patch vulnerabilities
        working-directory: mobile
        run: |
          npm update --legacy-peer-deps
          npm audit fix --legacy-peer-deps || true

      - name: Mobile audit report (non-blocking)
        working-directory: mobile
        run: npm audit --audit-level=moderate || true

      - name: Create or update maintenance PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: security/deps-maintenance
          delete-branch: true
          title: 'chore(deps): automated dependency maintenance'
          commit-message: 'chore(deps): automated dependency maintenance'
          body: |
            Automated dependency maintenance run:
            - `api`: `npm update`, `npm audit fix`, `npm audit --audit-level=moderate` (non-blocking report)
            - `mobile`: `npm update --legacy-peer-deps`, `npm audit fix --legacy-peer-deps`, `npm audit --audit-level=moderate` (non-blocking report)

            This updates the same PR while it is still open. If that PR is merged, the action deletes the branch and the next run will create a new branch/PR named `security/deps-maintenance`.
          labels: |
            dependencies
            security
          add-paths: |
            api/package.json
            api/package-lock.json
            mobile/package.json
            mobile/package-lock.json
