name: Dependency Maintenance

on:
  schedule:
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Update lockfile and patch vulnerabilities
        run: |
          npm update
          npm audit fix

      - name: Audit report (non-blocking)
        run: npm audit --audit-level=moderate || true

      - name: Create or update maintenance PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: security/deps-maintenance
          delete-branch: false
          title: 'chore(deps): automated dependency maintenance'
          commit-message: 'chore(deps): automated dependency maintenance'
          body: |
            Automated dependency maintenance run:
            - `npm update`
            - `npm audit fix`
            - `npm audit --audit-level=moderate` (non-blocking report)

            This is a rolling PR branch that gets updated on each scheduled run.
          labels: |
            dependencies
            security
          add-paths: |
            api/package.json
            api/package-lock.json
