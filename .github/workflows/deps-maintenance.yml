name: Dependency Maintenance

on:
  schedule:
    - cron: '0 10 * * 1'
    - cron: '0 10 * * 4'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  NPM_CHECK_UPDATES_VERSION: 22.2.9

concurrency:
  group: dependency-maintenance
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            mobile/package-lock.json

      - name: Pin npm version
        run: npm install --global npm@11.6.2

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Update API dependencies and patch vulnerabilities
        working-directory: api
        run: |
          npx --yes "npm-check-updates@${NPM_CHECK_UPDATES_VERSION}" --upgrade --target latest --reject typescript
          npm install
          npm audit fix || true

      - name: API audit report (non-blocking)
        working-directory: api
        run: npm audit --audit-level=moderate || true

      - name: Verify API lockfile consistency
        working-directory: api
        run: npm ci --ignore-scripts

      - name: Pin mobile npm version
        run: npm install --global npm@10.9.7

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Update mobile dependencies and patch vulnerabilities
        working-directory: mobile
        run: |
          npx --yes "npm-check-updates@${NPM_CHECK_UPDATES_VERSION}" --upgrade --target latest --reject typescript
          npm install
          npm audit fix || true

      - name: Mobile audit report (non-blocking)
        working-directory: mobile
        run: npm audit --audit-level=moderate || true

      - name: Verify mobile lockfile consistency
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Detect dependency changes
        id: dependency-changes
        shell: bash
        run: |
          if git diff --quiet -- \
            api/package.json api/package-lock.json \
            mobile/package.json mobile/package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected; no pull request is needed."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- \
              api/package.json api/package-lock.json \
              mobile/package.json mobile/package-lock.json
          fi

      - name: Create or update maintenance PR
        if: steps.dependency-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          author: "lawaloy <40930161+lawaloy@users.noreply.github.com>"
          committer: "stead-deps[bot] <stead-deps[bot]@users.noreply.github.com>"
          branch: security/deps-maintenance
          delete-branch: true
          title: 'chore(deps): automated dependency maintenance'
          commit-message: 'chore(deps): automated dependency maintenance'
          body: |
            Automated dependency maintenance run:
            - Advances direct dependency manifest ranges with pinned `npm-check-updates@22.2.9`.
            - Preserves the TypeScript 7 hold until the API and mobile toolchains support it.
            - Regenerates and verifies the `api` and `mobile` lockfiles with their CI-pinned npm versions.
            - Runs `npm audit fix` and records moderate-or-higher audit findings as non-blocking reports.

            This updates the same PR while it is still open. If that PR is merged, the action deletes the branch and the next run will create a new branch/PR named `security/deps-maintenance`.
          labels: |
            dependencies
            security
          add-paths: |
            api/package.json
            api/package-lock.json
            mobile/package.json
            mobile/package-lock.json
